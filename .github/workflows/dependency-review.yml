name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: vars.DEPENDENCY_REVIEW == 'enabled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, BlueOak-1.0.0, MPL-2.0, Unlicense, CC0-1.0
