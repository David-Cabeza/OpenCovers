name: Bug
description: Report behavior that does not match the contract.
title: "[bug] "
labels: ["bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The commit or version where the bug appears.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What does the contract say should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead? Include the response or the error.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A command or a numbered list. Use synthetic data.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I did not include API keys, guest data, or confidential third-party material.
          required: true
