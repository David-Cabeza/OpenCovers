# The hosted demo (ADR-0022, decision 10). A copy of compose.prod.yaml with DEMO_MODE=1, its own project name and
# its own volumes, so it never shares a database with a real instance. See docs/deploy.md#hosted-demo.
# Run: docker compose --env-file .env.demo -f compose.demo.yaml up -d --build
name: opencovers-demo

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencovers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.demo}
      POSTGRES_DB: opencovers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencovers -d opencovers"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: opencovers-demo-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &api-env
      DATABASE_URL: postgres://opencovers:${POSTGRES_PASSWORD}@db:5432/opencovers
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env.demo. Generate one with openssl rand -base64 32}
      BLOCKLIST_KEY: ${BLOCKLIST_KEY:?Set BLOCKLIST_KEY in .env.demo. Generate one with openssl rand -base64 32}
      BLOCKLIST_KEY_PREVIOUS: ${BLOCKLIST_KEY_PREVIOUS:-}
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://demo.opencovers.dev}
      TRUSTED_ORIGINS: ${PUBLIC_URL:-https://demo.opencovers.dev}
      # The demo signs visitors in by magic link or Google and never by password, whatever this says. closed is
      # the belt to that brace: no other path can create an account.
      SIGNUP: ${SIGNUP:-closed}
      DEMO_MODE: "1"
      NODE_ENV: production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEMO_MAX_RESERVATIONS: ${DEMO_MAX_RESERVATIONS:-}
      DEMO_MAX_GUESTS: ${DEMO_MAX_GUESTS:-}
      DEMO_MAX_WAITLIST: ${DEMO_MAX_WAITLIST:-}
      DEMO_MAX_TABLES: ${DEMO_MAX_TABLES:-}
      DEMO_MAX_SERVICES: ${DEMO_MAX_SERVICES:-}
      DEMO_MAX_FLOOR_ITEMS: ${DEMO_MAX_FLOOR_ITEMS:-}
      DEMO_MAX_INVITATIONS: ${DEMO_MAX_INVITATIONS:-}
      DEMO_MAX_API_KEYS: ${DEMO_MAX_API_KEYS:-}
      DEMO_MAX_BLOCKLIST: ${DEMO_MAX_BLOCKLIST:-}
      DEMO_MAX_SANDBOXES: ${DEMO_MAX_SANDBOXES:-}
      DEMO_MAX_NEW_PER_DAY: ${DEMO_MAX_NEW_PER_DAY:-}
      DEMO_PROVISION_CONCURRENCY: ${DEMO_PROVISION_CONCURRENCY:-}
      DEMO_PROVISION_QUEUE: ${DEMO_PROVISION_QUEUE:-}
      RATE_LIMIT_MAGIC_LINK: ${RATE_LIMIT_MAGIC_LINK:-}
      RATE_LIMIT_MAGIC_LINK_DAY: ${RATE_LIMIT_MAGIC_LINK_DAY:-}
      RATE_LIMIT_MAGIC_LINK_IP: ${RATE_LIMIT_MAGIC_LINK_IP:-}
      RATE_LIMIT_DEMO_CHALLENGE: ${RATE_LIMIT_DEMO_CHALLENGE:-}
      RATE_LIMIT: ${RATE_LIMIT:-on}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-}
      RATE_LIMIT_SIGNUP: ${RATE_LIMIT_SIGNUP:-}
      RATE_LIMIT_INVITATION: ${RATE_LIMIT_INVITATION:-}
      RATE_LIMIT_VENUE_CREATION: ${RATE_LIMIT_VENUE_CREATION:-}
      RATE_LIMIT_PUBLIC_READ: ${RATE_LIMIT_PUBLIC_READ:-}
      RATE_LIMIT_PUBLIC_BOOKING: ${RATE_LIMIT_PUBLIC_BOOKING:-}
      RATE_LIMIT_PUBLIC_VENUE: ${RATE_LIMIT_PUBLIC_VENUE:-}
      RATE_LIMIT_PUBLIC_SELF_SERVICE: ${RATE_LIMIT_PUBLIC_SELF_SERVICE:-}
      RATE_LIMIT_PUBLIC_DAYS: ${RATE_LIMIT_PUBLIC_DAYS:-}
      PUBLIC_POW_DIFFICULTY: ${PUBLIC_POW_DIFFICULTY:-}
      PUBLIC_CHALLENGE_SECRET: ${PUBLIC_CHALLENGE_SECRET:-}
      # Unset, the API serves no widget page. Set, it serves it only for requests to that host (ADR-0017, Q1).
      WIDGET_ADDRESS: ${WIDGET_ADDRESS:-book.demo.opencovers.dev}
      # Required in practice: without them no magic link is delivered.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Housekeeping, daily: deletes sandboxes idle for 14 days and leads past retention. The first run is at start-up,
  # so a deploy also runs it. It shares the API image and its environment, and the CLI refuses to run unless DEMO_MODE=1.
  cleanup:
    image: opencovers-demo-api:local
    pull_policy: never
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    working_dir: /app/apps/api
    # The same settings as the API: the CLI reads DEMO_MODE, Resend and Google through the same checks.
    environment: *api-env
    command: ["sh", "-c", "while true; do pnpm demo:cleanup || true; sleep 86400; done"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-demo.opencovers.dev}
      # The demo always has a widget host: the sandbox's booking page is half of the story.
      WIDGET_ADDRESS: ${WIDGET_ADDRESS:-book.demo.opencovers.dev}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data

# Project-scoped names (opencovers-demo_pgdata): never the volumes of a prod stack on the same Docker host.
volumes:
  pgdata:
  caddy_data:
