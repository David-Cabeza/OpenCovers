openapi: 3.0.3
info:
  title: OpenCovers Reservations API
  version: 0.1.0
  description: |
    OpenCovers is an independent reservations engine for restaurants.
    This contract defines the HTTP API. The MCP server exposes the same
    operations with the tool ids in docs/contract/mcp.md.
    Every reservation and waitlist write takes an `Idempotency-Key` header,
    so a retry returns the first result instead of writing twice, and every
    reservation write produces a monotonic version. See
    docs/contract/errors.md for the error vocabulary.

    Some calls are rate limited per client address. A refused call returns
    429 with the code `rate_limited` and a `Retry-After` header. The limited
    calls are the sign-in and sign-up routes under /api/auth, invitation
    redemption and venue creation (`POST /venues`). They are listed in
    docs/adr/0007-rate-limiting.md. Every request under `/public/` is also
    limited, `GET` included, by the five rules of
    docs/adr/0017-booking-widget-and-self-service-link.md and
    docs/adr/0021-widget-day-status-zones-waitlist.md: `public_read`,
    `public_booking`, `public_venue`, `self_service` and `public_days`.

    A request body over 16 KB under `/public/`, or over 256 KB elsewhere,
    fails with `invalid_request`. A write made with a staff session
    cookie, not a key, fails with `forbidden` when its `Origin` is not a
    trusted origin of the instance, and with `invalid_request` when its
    body is not `application/json`.

    Paths are relative to `/v1`, except `/w/embed.js`, `/w/{bookingKey}`
    and `/r`, which are served at the root of the widget origin.

    The routes under `/public/` are the guest-facing booking channel. They
    need no credentials, read no cookie or session, and are not exposed
    through MCP. A guest names a venue with its public booking key, which
    is a lookup handle and not a secret, and names one booking with a
    self-service token in the `X-Self-Service-Token` header. No public
    response holds another guest's data, a table id, a zone, a reservation
    id, a guest id, attribution, a key other than the booking key it was
    called with, or an unmasked contact. Every answer under `/public/`, an
    error included, sends `Cache-Control: no-store` and no CORS headers.

security:
  - ApiKeyAuth: []

paths:
  /venues:
    get:
      operationId: venue.list
      summary: List the venues the signed-in account belongs to
      description: |
        Needs a staff session. A key fails with `unauthorized`. Returns only
        the venues where the account holds a membership, with its role in
        each. The `SIGNUP` mode does not change it.
      security: []
      responses:
        "200":
          description: The account's venues, by name
          content:
            application/json:
              schema:
                type: object
                required: [venues]
                properties:
                  venues:
                    type: array
                    items:
                      type: object
                      required: [id, name, timezone, enabled, role]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        timezone: { type: string }
                        enabled: { type: boolean }
                        role: { type: string, enum: [read, write, admin] }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: venue.create
      summary: Create a venue
      description: |
        Needs a staff session. A key of any role, with or without a session,
        never creates a venue, and a request with only a key fails with
        `unauthorized`. The creator becomes `admin` of the new venue.

        Who may call it depends on the instance's `SIGNUP` mode. Under
        `open` any signed-in account may. Under `first-user` and `closed`
        only the owner may, the account that claimed the instance under
        `first-user`. Any other account, an invited one included, even with
        the `admin` role in an existing venue, fails with `403` and
        `venue_creation_closed`, and nothing is created. That check runs
        before the body is validated. See ADR-0008.

        The server always generates the venue id. A body with an `id` key
        fails with `invalid_request` and creates nothing, so a caller cannot
        probe which ids exist in other accounts.

        The call is rate limited per client address, 10 per hour by default
        (`RATE_LIMIT_VENUE_CREATION`). The limit runs before the session and
        the body are read, so a call that fails with `unauthorized`, `403` or
        `invalid_request` also spends budget. The route takes no
        `Idempotency-Key`, so a repeated call is a new call and counts.
        A call over the limit fails with `429`, `rate_limited` and
        `Retry-After`, and creates nothing. See ADR-0007.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
                timezone:
                  type: string
                  description: |
                    An IANA zone name, `Europe/Madrid` for example. Absent or
                    null means `UTC`. A value that is not a string, or that
                    is not a zone the server's time zone database knows, fails
                    with `invalid_request` and nothing is created. The zone is
                    stored as given.
      responses:
        "201":
          description: The venue was created
          content:
            application/json:
              schema:
                type: object
                required: [venue]
                properties:
                  venue:
                    type: object
                    required: [id, name]
                    properties:
                      id: { type: string }
                      name: { type: string }
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/availability:
    get:
      operationId: reservation.availability
      summary: List bookable slots for a venue, date, and party size, grouped by service
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: partySize
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: service
          in: query
          required: false
          description: Filter to one service. When omitted, the response is grouped by service.
          schema: { type: string }
      responses:
        "200":
          description: The bookable slots, keyed by service name
          content:
            application/json:
              schema:
                type: object
                required: [availability]
                properties:
                  availability:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: "#/components/schemas/AvailabilitySlot" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/availability/explain:
    get:
      operationId: reservation.availability_explain
      summary: Explain why a time is or is not bookable for a party size
      description: |
        Evaluates the request with the same rules that decide availability
        and create. `available` is true exactly when a create for the same
        date, time, party size, and zone would succeed and the availability
        list shows the time as free. Every blocking reason is returned, in
        the order of `ExplainReason`, and a create fails with the code of the
        first. A blocked time returns up to 3 nearest available times on the
        same date, nearest first. The tables are checked for the turn time
        of the party size, as a create holds them. The answer holds no
        personal data and no table ids. Readable by any key or session that
        can read the venue.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: time
          in: query
          required: true
          schema: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "21:30" }
        - name: partySize
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: zone
          in: query
          required: false
          description: Only tables in this zone count, as in a create with `zone`.
          schema: { type: string }
      responses:
        "200":
          description: The explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityExplanation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/agenda:
    get:
      operationId: reservation.agenda
      summary: List the reservations for a venue on one day, grouped by service
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: service
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The day's reservations
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations:
                    type: array
                    items: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations:
    get:
      operationId: reservation.list
      summary: List the reservations of the authenticated guest
      description: |
        The guest is derived from the authenticated principal of the channel.
        A caller with no guest principal gets an empty list.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The guest's reservations
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations:
                    type: array
                    items: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: reservation.create
      summary: Create a reservation
      description: |
        The reservation holds its tables for the venue's turn time for the
        party size, or 120 minutes when the venue has none. A party outside
        the limits of the service that covers the time fails with
        `party_size_too_small` or `party_size_too_large`. A walk-in is not
        held to the service limits, as it is not held to the slot grid or
        the lead time, or to the booking horizon and blocked dates of the
        venue. A date further ahead than `maxAdvanceDays` fails with
        `beyond_booking_horizon`, and a blocked date with `date_blocked`.
        A `date` that is not a real `YYYY-MM-DD` calendar date, or is
        outside `1900-01-01` to `9998-12-31`, and a `time` that is not
        `HH:MM`, fail with `invalid_request`, here, on the walk-in and on
        every query that takes a date (C60).
        A guest who already holds `maxActivePerGuestPerDay` active bookings
        on the date, found by the guest's contact, fails with
        `guest_booking_limit` (409). A booking without a usable contact is
        not counted against the cap.

        A contact on the venue's guest blocklist (ADR-0018) fails with
        `booking_declined` (409), whoever calls, a staff session included.
        The check runs last, after the table search and the overbooking
        room, so a closed, blocked, capped, full or taken time fails with
        its own code for a blocked contact as for any other. A declined
        create books nothing, keeps no guest record, stores no idempotency
        key, emits no event and sends no email, so the same key books once
        an admin removes the entry. A repeat of a create that succeeded
        before the entry was added returns that booking. A booking without a
        usable contact, a walk-in and a seat from the waitlist are not
        checked. Availability and the explanation never consult the list.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationCreate" }
      responses:
        "200":
          description: The created reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/search:
    get:
      operationId: reservation.search
      summary: Search reservations across a date range
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: dateStart
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dateEnd
          in: query
          required: true
          schema: { type: string, format: date }
        - name: status
          in: query
          required: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/ReservationStatus" }
      responses:
        "200":
          description: Matching reservations
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations:
                    type: array
                    items: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/{reservationId}:
    get:
      operationId: reservation.get
      summary: Read one reservation
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/reservationId"
      responses:
        "200":
          description: The reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/{reservationId}/modify:
    post:
      operationId: reservation.modify
      summary: Modify a reservation, producing a new version
      description: >
        Party size and tables can change on `booked` and `seated` reservations.
        A modify that changes only `guest.consent` and/or `rating` is also
        accepted on `attended`. `cancelled` and `no_show` reject every modify
        with `invalid_transition`. A body with only consent or rating sends no
        email to the guest. A modify that would leave a `seated` reservation
        without tables fails with `table_required`. A table that another
        booking holds fails with `slot_taken`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/reservationId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationModify" }
      responses:
        "200":
          description: The modified reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/{reservationId}/cancel:
    post:
      operationId: reservation.cancel
      summary: Cancel a reservation
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/reservationId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: The cancelled reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/{reservationId}/status:
    post:
      operationId: reservation.status
      summary: Move a reservation to a new status
      description: |
        The engine enforces the allowed transitions. An invalid transition
        fails with `invalid_transition`. A move to `seated` also needs the
        reservation to hold at least one table, and fails with
        `table_required` when it holds none, as an overbooked booking does.
        Staff assign a table with a modify first. The failed call writes
        nothing, so the same key can be sent again after the assignment.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/reservationId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [seated, attended, no_show]
      responses:
        "200":
          description: The reservation in its new status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/waitlist:
    get:
      operationId: waitlist.list
      summary: List the guests waiting for a table, oldest first
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The waiting entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntries" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: waitlist.add
      summary: Add a guest to the waitlist
      description: |
        With an `Idempotency-Key`, a repeat of the key in the venue adds
        nothing and returns 201 with the current list, even when the body
        differs, as a repeated create returns the original booking. A key
        used before for another kind of write fails with `invalid_request`.
        Without a key every call adds an entry.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/optionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partySize]
              properties:
                partySize: { type: integer, minimum: 1 }
                zone: { type: string }
                guest:
                  type: object
                  properties:
                    name: { type: string }
                    contact: { type: string }
      responses:
        "201":
          description: The waiting entries, the new one included
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntries" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/waitlist/{entryId}/seat:
    post:
      operationId: waitlist.seat
      summary: Seat a waiting guest as a walk-in
      description: |
        Creates a seated reservation for the entry, as a walk-in does, and
        marks the entry `seated`. A repeat of the key for the same entry
        returns the same reservation. The key of a seat of another entry, or
        of another kind of write, fails with `invalid_request`. An entry that
        is no longer waiting fails with `invalid_transition`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/entryId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: The new reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/waitlist/{entryId}/cancel:
    post:
      operationId: waitlist.cancel
      summary: Remove a guest from the waitlist
      description: |
        With an `Idempotency-Key`, a repeat of the key for the same entry
        changes nothing and returns 200 with the current list. The key of a
        cancel of another entry, or of another kind of write, fails with
        `invalid_request`. Without a key a second cancel fails with
        `invalid_transition`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/entryId"
        - $ref: "#/components/parameters/optionalIdempotencyKey"
      responses:
        "200":
          description: The waiting entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntries" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/config:
    get:
      operationId: venue.getConfig
      summary: Read the venue configuration
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The venue configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueConfig" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: venue.setConfig
      summary: Update the venue configuration
      description: |
        Enabling the venue without a notice address fails with
        `notice_address_required`. Clearing the notice address while the
        venue is enabled fails the same way. A `phoneCountry` that is not a
        supported ISO 3166 alpha-2 code in upper case fails with
        `invalid_request`. Null clears it. Malformed `turnTimes` fail with
        `invalid_request`, and an empty array clears them. An
        `overbookingCeiling` that is not an integer from 0 to 1000 fails with
        `invalid_request`. A `maxAdvanceDays` that is not null or an integer
        from 0 to 1000, a `maxActivePerGuestPerDay` that is not null or an
        integer from 1 to 100, and a `blockedDates` that is not a list of at
        most 366 valid dates or ranges also fail with `invalid_request`.
        Admin only. Any other role fails with `forbidden`. A policy change
        never cancels or alters a booking that already exists.

        Takes no `Idempotency-Key`. The body replaces the fields it names,
        so a repeat with the same body sets the same configuration.
      parameters:
        - $ref: "#/components/parameters/venueId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueConfig" }
      responses:
        "200":
          description: The updated venue configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueConfig" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/public-profile:
    get:
      operationId: venue.getPublicProfile
      summary: Read the venue's public profile fields
      description: |
        The fields behind `public.jsonld`, for staff. Any role of the venue
        reads them. Not exposed through MCP.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: venue.setPublicProfile
      summary: Update the venue's public profile
      description: |
        Partial update. A field that is absent stays, and `null` clears it.
        An invalid field fails with `invalid_request`: a URL that is not
        `https` or carries credentials, a `country` that is not a supported
        upper-case ISO 3166-1 alpha-2 code, a string over its length limit,
        a malformed phone or `priceRange`, or a coordinate out of range.
        Setting `publicProfileEnabled` to true needs a venue name, `street`,
        `locality` and `country`. Setting only one of `latitude` and
        `longitude` is refused. Either failure is `public_profile_incomplete`.
        The private `noticeAddress` is never published. Admin only. Any other
        role fails with `forbidden`. Not exposed through MCP.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicProfile" }
      responses:
        "200":
          description: The updated public profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/public.jsonld:
    get:
      operationId: venue.publicJsonLd
      summary: The venue as schema.org Restaurant JSON-LD
      description: |
        Public. Needs no credentials and is not rate limited (ADR-0007 never
        limits GET). It returns the document only when the venue turned
        `publicProfileEnabled` on. An unknown venue and a venue with the
        profile off give the same `404` with `venue_not_found`, the same body
        and the same headers. The document holds the venue name, the public
        address, the optional `url`, `telephone`, `servesCuisine`,
        `priceRange` and `geo`, one `openingHoursSpecification` entry per
        service (each for its own `days`), and a `ReserveAction` only when
        `bookingUrl` is set. It never holds `noticeAddress`, an email, a key
        or guest data. It carries `ETag` and `Cache-Control: public,
        max-age=300`, and `If-None-Match` gets `304`.
        `Access-Control-Allow-Origin` is `*`. Not exposed through MCP.
        See docs/adr/0012-public-profile-jsonld.md.
      security: []
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The Restaurant document
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/ld+json:
              schema: { $ref: "#/components/schemas/RestaurantJsonLd" }
        "304":
          description: Not modified
        "404":
          description: Unknown venue, or the profile is off. Cacheable for 60 seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /venues/{venueId}/services:
    get:
      operationId: venue.listServices
      summary: List the venue's services
      description: Not exposed through MCP.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The services, by opening time
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/Service" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: venue.upsertService
      summary: Create or update a service by name
      description: |
        A limit left out keeps its stored value, and null clears it. A limit
        that is not an integer of at least 1, or a minimum above the maximum
        after the update, fails with `invalid_request`. `days` is a non-empty
        list of distinct ISO weekdays, 1 (Monday) to 7 (Sunday). It defaults to
        all seven for a new service, and a call that leaves it out keeps the
        stored value. An empty list, null, a value outside 1 to 7 or a
        duplicate fails with `invalid_request`. A service belongs to the day it
        opens, so the part of an overnight service after midnight follows the
        weekday of the previous date. Availability omits a service on a day it
        does not serve, and a create for a time only that service covers fails
        with `outside_hours`, walk-ins included. Admin only. Any other
        role fails with `forbidden`. Not exposed through MCP.
      parameters:
        - $ref: "#/components/parameters/venueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, openStart, openEnd]
              properties:
                name: { type: string, minLength: 1 }
                openStart: { type: string, example: "19:00" }
                openEnd: { type: string, example: "23:00" }
                minPartySize: { type: integer, minimum: 1, nullable: true }
                maxPartySize: { type: integer, minimum: 1, nullable: true }
                days: { $ref: "#/components/schemas/ServiceDays" }
      responses:
        "200":
          description: The venue's services after the update
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/Service" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/events:
    get:
      operationId: reservation.events
      summary: Poll the event feed from a cursor
      description: |
        The cursor is scoped to the venue. Events are retained for the venue's
        retention period. A cursor older than the retention period fails with
        `expired_cursor`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Events after the cursor
          content:
            application/json:
              schema:
                type: object
                required: [events, nextCursor]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  nextCursor:
                    type: string
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/webhooks:
    get:
      operationId: webhook.list
      summary: List the venue's webhook endpoints
      description: |
        Needs a `write` or `admin` key or session. A `read` key fails with
        `forbidden`. The secret is never returned. Not exposed through MCP.
        See docs/contract/webhooks.md.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The venue's endpoints
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: webhook.create
      summary: Register a webhook endpoint
      description: |
        The URL must be https, carry no credentials, and resolve only to
        public addresses, otherwise it fails with `webhook_url_rejected`. A
        venue has at most 5 endpoints, and a sixth fails with
        `webhook_limit_reached`. The endpoint receives only events written
        after it was registered, each as a signed POST of `WebhookPayload`.
        The secret appears only in this response.
      parameters:
        - $ref: "#/components/parameters/venueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "201":
          description: The registered endpoint and its signing secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCreated" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/webhooks/{webhookId}:
    delete:
      operationId: webhook.delete
      summary: Remove a webhook endpoint
      description: |
        An id that belongs to another venue fails with `webhook_not_found`,
        the same as an unknown id.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: webhookId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The remaining endpoints
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/erasure:
    post:
      operationId: reservation.erasure
      summary: Erase personal data by guest id or by principal
      description: |
        Admin only. Any other role fails with `forbidden`, and nothing is
        erased. Erasure is irreversible, so a leaked `write` key cannot
        destroy guest data. Retention runs inside the engine and is not
        affected.

        Erasure returns counts. For each erased reservation the event feed
        emits an `erased` event carrying a tombstone hash. Erasure also resets
        the reservation's consent to `unknown`, its rating to null, its
        commentary to an empty string, and its reconfirmation to `none`.

        `guestId` is the guest record id, as returned in `guest.guestId`.
        Erasure by guest id blanks every reservation linked to that guest and
        to any guest merged into it, unlinks them, and deletes those guest
        records. Each erased reservation keeps its date, party size, and
        status, so cover counts survive. It also deletes the venue's waitlist
        entries whose contact normalizes to one of the guest's keys. Erasing
        a guest that was merged into another also erases the reservations
        moved at that merge, which the target still holds.

        Erasure and retention clear the stored prior state of every merge
        audit entry about an erased or expired guest. The entry keeps its
        ids, action, principal, and time, and the merge can no longer be
        undone.

        Deprecated: a `guestId` that is not a guest record of the venue is
        read as a contact. The contact is normalized and erases the guest it
        matches, plus any reservation and waitlist entry whose contact equals
        it exactly. This fallback is kept for one version.

        `erasedGuests` counts the guest records deleted. A contact that
        matches no guest record reports 0, even when it erased reservations
        or waitlist entries.

        Erasure by principal blanks and unlinks every reservation owned by
        that principal. It then deletes each guest record of the venue that
        was linked to one of them, with any guest merged into it, unless that
        guest still has a reservation that is not erased. A guest with a
        visit owned by another principal stays. It does not touch the
        waitlist. `erasedGuests` counts the guest records deleted.

        A guest record also expires on its own after the venue's retention
        period, counted from its latest visit. Its reservations are blanked
        the same way and emit the same `erased` events. A reservation with no
        guest record that holds a name or contact also expires, once its end
        is older than the retention period. It is blanked the same way.

        Erasure keeps the venue's guest blocklist entries (ADR-0018). An
        entry is not linked to a guest, and removing it on request would let
        a blocked guest unblock themselves. `blocklistEntriesKept` counts the
        entries that match the email or phone of a guest record it deleted,
        or the contact it was given. An admin removes an entry with
        `blocklist.remove`, and retention deletes it after its `expiresAt`.

        Takes no `Idempotency-Key`. A repeat erases nothing more and reports
        0 for what the first call erased.
      parameters:
        - $ref: "#/components/parameters/venueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                guestId:
                  type: string
                  description: The guest record id. A contact is accepted as a deprecated fallback.
                principal:
                  type: string
      responses:
        "200":
          description: The erasure counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErasureResult" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/guests:
    get:
      operationId: guest.list
      summary: List the venue's guests
      description: |
        Any key or session that can read the venue. Guests are ordered by
        `lastVisitAt` descending, then by id. A guest merged into another, or
        whose personal fields were cleared by retention, is not listed.
        `contact` matches the normalized email or phone with the same rule as
        booking, and a contact that does not normalize matches nothing.
        `name` matches a case-insensitive name prefix. Pass `nextCursor` back
        as `cursor` for the next page. It is null on the last page. A cursor
        from another venue or a malformed one fails with `invalid_request`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: contact
          in: query
          required: false
          schema: { type: string }
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of guests
          content:
            application/json:
              schema:
                type: object
                required: [guests, nextCursor]
                properties:
                  guests:
                    type: array
                    items: { $ref: "#/components/schemas/GuestRecord" }
                  nextCursor:
                    type: string
                    nullable: true
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/guests/{guestId}:
    get:
      operationId: guest.get
      summary: Read one guest with its visits
      description: |
        A guest of another venue, a guest merged into another, and a guest
        cleared by retention fail with `guest_not_found`. The visits are the
        reservations the guest holds, which include those of every guest
        merged into it.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/guestId"
      responses:
        "200":
          description: The guest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestDetail" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/guests/{guestId}/merge:
    post:
      operationId: guest.merge
      summary: Merge this guest into another
      description: |
        Admin only. Any other role fails with `forbidden`. Both guests must
        belong to the venue and hold personal data, otherwise the call fails
        with `guest_not_found`. Merging a guest into itself fails with
        `invalid_request`. A source or target already merged into another
        guest fails with `guest_merged`, so a merge can never form a cycle.

        In one transaction every reservation of this guest moves to the
        target, the target's `lastVisitAt` becomes the later of the two, and
        this guest is kept, merged into the target. A later booking with this
        guest's contact links to the target. The audit entry keeps this
        guest's prior state and the ids of the moved reservations until an
        unmerge, an erasure, or retention clears it. Repeating the
        Idempotency-Key returns the target without merging again. Reusing it
        for another merge fails with `invalid_request`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/guestId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intoGuestId]
              properties:
                intoGuestId:
                  type: string
      responses:
        "200":
          description: The target guest after the merge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestDetail" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/guests/{guestId}/unmerge:
    post:
      operationId: guest.unmerge
      summary: Undo the latest merge of this guest
      description: |
        Admin only. Any other role fails with `forbidden`. The guest returns
        to active with its prior name and contacts. The reservations moved at
        merge time return to it. A reservation booked after the merge stays
        with the target. The target's `lastVisitAt` is recomputed from the
        reservations it still holds.

        A guest that is not merged fails with `guest_not_merged`, so a second
        unmerge fails. A merge whose audit entry is missing or was cleared by
        erasure or retention fails with `unmerge_unavailable`. A target that
        was itself merged since fails with `guest_merged`. Unmerge it first.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/guestId"
      responses:
        "200":
          description: The restored guest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestDetail" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/invitations:
    get:
      operationId: invitation.list
      summary: List the venue's staff invitations
      description: |
        Admin only, and only through a staff session. A key of any role, an
        `admin` key included, fails with `forbidden`, and so does any other
        session role. Newest first. The token and its hash are never
        returned. Not exposed through MCP. See ADR-0006.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The venue's invitations in any status
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: invitation.create
      summary: Invite a person to the venue
      description: |
        Admin only, and only through a staff session. A key of any role, an
        `admin` key included, fails with `forbidden`. The invitation grants
        one membership in this venue with the given `role`, to whoever
        redeems the token once before it expires.

        With `email` the invitation is bound to that address, compared
        without regard to case. Without it the invitation is an open link
        that anyone holding the token can redeem. `expiresInHours` is an
        integer from 1 to 336 and defaults to 72. A `role` outside `read`,
        `write`, and `admin`, a malformed `email`, or a bad `expiresInHours`
        fails with `invalid_request`.

        The `token` appears only in this response. The engine stores a hash
        and sends no email, so the admin passes the token to the invitee.
        See ADR-0006.
      parameters:
        - $ref: "#/components/parameters/venueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
                email: { type: string, format: email }
                expiresInHours: { type: integer, minimum: 1, maximum: 336, default: 72 }
      responses:
        "201":
          description: The invitation and its one-time token
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: { $ref: "#/components/schemas/InvitationCreated" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/invitations/{invitationId}:
    delete:
      operationId: invitation.revoke
      summary: Revoke a pending invitation
      description: |
        Admin only, and only through a staff session. A pending invitation
        becomes `revoked` and its token stops working. Revoking a revoked
        or expired invitation returns it unchanged. Revoking a redeemed
        invitation fails with `invitation_redeemed` and changes nothing. An
        id that belongs to another venue fails with `invitation_not_found`,
        the same as an unknown id.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The invitation
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: { $ref: "#/components/schemas/Invitation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/members:
    get:
      operationId: member.list
      summary: List the venue's staff members
      description: |
        Admin only, and only through a staff session. A key of any role, an
        `admin` key included, fails with `forbidden`, and so does any other
        session role. The list shows each member's `userId`, `name`, `email`,
        and `role`, ordered by email, and only for this venue. It holds no
        sign-in or session data and no start date. Not exposed through MCP.
        See ADR-0009.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The venue's members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/members/{userId}:
    patch:
      operationId: member.setRole
      summary: Change a member's role
      description: |
        Admin only, and only through a staff session. Sets the person's role
        in this venue to `admin`, `write`, or `read`. The new role applies on
        their next request. Setting the role they already hold succeeds and
        changes and records nothing.

        A venue always keeps at least one `admin`. A change that would leave
        none, including an admin demoting themselves as the only admin, fails
        with `last_admin` and changes nothing. It takes the same lock as
        removal, so concurrent changes and removals are serialized. An admin
        may demote themselves when another admin remains.

        A `userId` that is unknown, or is a member of another venue only,
        fails with `member_not_found`. A role outside the three fails with
        `invalid_request`. A change writes one `role_changed` row to the
        membership audit log with the new role. Keys the person made, and
        their sessions, are not touched. See ADR-0016.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: The member with the role they now hold
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member:
                    type: object
                    required: [userId, role]
                    properties:
                      userId: { type: string }
                      role: { $ref: "#/components/schemas/Role" }
        default:
          $ref: "#/components/responses/Error"

    delete:
      operationId: member.remove
      summary: Remove a member from the venue
      description: |
        Admin only, and only through a staff session. Deletes the person's
        membership in this venue. Their next request to the venue fails with
        `venue_not_found`. Their account, their sessions, and their other
        venues are untouched.

        In the same transaction the removal revokes the API keys the person
        made in this venue, revokes all their sessions when this was their
        last membership (and keeps them when they still belong to another
        venue, because a session belongs to the account), and sets
        `creatorDepartedAt` on the webhook endpoints they made, which keep
        delivering. A failure anywhere rolls all of it back. Keys, endpoints,
        and sessions made before ADR-0011 have no recorded creator and are not
        reached.

        A venue always keeps at least one `admin`. A removal that would leave
        none, including an admin removing themselves, fails with
        `last_admin` and changes nothing. Concurrent removals are serialized,
        so of two admins removing each other one succeeds. An admin may
        remove themselves when another admin remains.

        A `userId` that is unknown, or is a member of another venue only,
        fails with `member_not_found`, the same answer for both. To change a
        role instead, see `member.setRole`. A removal is not recorded in the
        event feed. See ADR-0009 and ADR-0011.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The membership that was removed, and what it revoked
          content:
            application/json:
              schema:
                type: object
                required: [member, revoked]
                properties:
                  member:
                    type: object
                    required: [userId, role]
                    properties:
                      userId: { type: string }
                      role: { $ref: "#/components/schemas/Role" }
                  revoked:
                    type: object
                    required: [keys, sessions, webhooksFlagged]
                    properties:
                      keys: { type: integer, minimum: 0 }
                      sessions: { type: integer, minimum: 0 }
                      webhooksFlagged: { type: integer, minimum: 0 }
        default:
          $ref: "#/components/responses/Error"

  /account:
    get:
      operationId: account.get
      summary: Say whether the signed-in account is the instance's venue creator
      description: |
        Needs a staff session. A key fails with `forbidden`. `isCreator` is
        true for the one account that may create venues under
        `SIGNUP=first-user` and `SIGNUP=closed` (ADR-0008). It does not
        depend on the `SIGNUP` mode.
      responses:
        "200":
          description: The caller's account
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    type: object
                    required: [userId, isCreator]
                    properties:
                      userId: { type: string }
                      isCreator: { type: boolean }
        default:
          $ref: "#/components/responses/Error"

  /account/transfer-creator:
    post:
      operationId: account.transferCreator
      summary: Hand the venue creator mark to another account
      description: |
        Only the current creator, through a staff session. A key, and any
        other account, an admin included, fails with `forbidden`. The target
        must be a member of at least one venue the caller administers. Any
        other `userId`, an unknown one included, fails with `member_not_found`.
        A missing or empty `userId` fails with `invalid_request`.

        On success the target is the creator and the caller is not. The swap
        runs in one transaction, so there is never zero or two creators, and
        of two concurrent transfers by the creator one wins and the other
        fails with `forbidden`. Naming yourself succeeds and changes nothing.
        One `creator_transferred` row is written to the audit log of each
        venue the two accounts share where the caller is `admin`. The caller
        keeps every membership. Only the new creator can hand the mark back.
        See ADR-0016.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "200":
          description: The new creator
          content:
            application/json:
              schema:
                type: object
                required: [creator]
                properties:
                  creator:
                    type: object
                    required: [userId]
                    properties:
                      userId: { type: string }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/audit:
    get:
      operationId: audit.list
      summary: Read the venue's membership audit log
      description: |
        Admin only, through a staff session or an `admin` key. A `read` or
        `write` session or key fails with `forbidden`, and a caller outside
        the venue fails with `venue_not_found`. Entries are newest first. The
        log records invitations created, revoked, and redeemed, and member
        removals (ADR-0010), role changes, and creator transfers (ADR-0016),
        and guest blocklist entries added and removed (ADR-0018). It holds ids
        and a role only, never an email, a name, an invitation token, a key,
        a contact, a blocklist hash, or a blocklist reason. Pass `nextCursor` back as
        `cursor` for the next page. It is null on the last page. A cursor from
        another venue or a malformed one, and a bad `limit`, fail with
        `invalid_request`. Not exposed through MCP. See ADR-0011.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of audit entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, nextCursor]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/MembershipAuditEntry" }
                  nextCursor:
                    type: string
                    nullable: true
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/blocklist:
    get:
      operationId: blocklist.list
      summary: List the venue's guest blocklist
      description: |
        Admin only, and only through a staff session. A `read` or `write`
        session, and a key of any role, an `admin` key included, fail with
        `forbidden`. Entries are newest first. An entry shows its kind,
        reason, creator, creation and expiry times, and whether a configured
        key can match it. It never shows the contact or its hash, so the list
        does not say whom an entry refuses. Use `blocklist.lookup` for that.
        Pass `nextCursor` back as `cursor` for the next page. It is null on
        the last page. A cursor from another venue or a malformed one, a bad
        `limit`, and any other query parameter fail with `invalid_request`.
        Not exposed through MCP. See ADR-0018.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of blocklist entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, nextCursor]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/BlocklistEntry" }
                  nextCursor:
                    type: string
                    nullable: true
        default:
          $ref: "#/components/responses/Error"

    post:
      operationId: blocklist.add
      summary: Refuse bookings for a guest's contacts
      description: |
        Admin only, and only through a staff session. A `read` or `write`
        session, and a key of any role, an `admin` key included, fail with
        `forbidden`.

        With `guestId`, adds one entry for each email and phone of that guest
        and of every guest merged into it, so staff never type a contact
        again. A guest of another venue, a guest merged into another, and a
        guest cleared by retention fail with `guest_not_found`. The response
        then carries `bookedReservations`, the number of that guest's
        reservations still `booked`, computed and not stored. An add never
        cancels or changes a booking.

        With `contact`, the engine normalizes it with the venue's default
        country, as a booking does, stores only a keyed hash, and drops the
        clear value. A contact that does not normalize fails with
        `invalid_request`. A contact travels only in the body. The route
        refuses any query parameter with `invalid_request`.

        An entry that already exists, under the current or the previous key,
        is returned with `created: false`, keeps its reason, and writes no
        audit row, so the call needs no `Idempotency-Key`. Each entry created
        writes one `guest_blocked` row to the audit log. A venue holds at most
        10,000 entries. An add that would pass it fails with
        `blocklist_limit_reached` and adds nothing. The response never holds a
        contact or a hash. Not exposed through MCP. See ADR-0018.
      parameters:
        - $ref: "#/components/parameters/venueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BlocklistSubject"
                - type: object
                  properties:
                    reason: { $ref: "#/components/schemas/BlocklistReason" }
      responses:
        "200":
          description: One entry per normalized contact, created or already there
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/BlocklistEntry"
                        - type: object
                          required: [created]
                          properties:
                            created:
                              type: boolean
                              description: False when the entry already existed.
                  bookedReservations:
                    type: integer
                    minimum: 0
                    description: |
                      Present on an add by `guestId` only. The guest's
                      reservations, its merged guests' included, whose status
                      is `booked`.
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/blocklist/lookup:
    post:
      operationId: blocklist.lookup
      summary: Find the blocklist entries for a guest or a contact
      description: |
        Admin only, and only through a staff session, with the same refusals
        as `blocklist.add`. Takes `guestId`, covering the guests merged into
        it, or `contact`, normalized as on add, in the body, never in the
        query string. Returns the matching entries of this venue under any
        configured key, newest first, or an empty list. Use it to fix a wrong
        lockout or to answer a guest who asks what the venue holds about
        them. It writes nothing. Not exposed through MCP. See ADR-0018.
      parameters:
        - $ref: "#/components/parameters/venueId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlocklistSubject" }
      responses:
        "200":
          description: The matching entries, possibly none
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/BlocklistEntry" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/blocklist/{entryId}:
    delete:
      operationId: blocklist.remove
      summary: Remove one blocklist entry
      description: |
        Admin only, and only through a staff session, with the same refusals
        as `blocklist.add`. Deletes the entry and returns it. An unknown id
        and an entry of another venue fail with `blocklist_entry_not_found`,
        the same answer, so a second delete fails with it too and the call
        needs no `Idempotency-Key`. Writes one `guest_unblocked` row to the
        audit log. The entry's audit rows stay and hold only its random id.
        Not exposed through MCP. See ADR-0018.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: entryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The entry that was removed
          content:
            application/json:
              schema:
                type: object
                required: [entry]
                properties:
                  entry: { $ref: "#/components/schemas/BlocklistEntry" }
        default:
          $ref: "#/components/responses/Error"

  /invitations/redeem:
    post:
      operationId: invitation.redeem
      summary: Redeem an invitation with a signed-in account
      description: |
        Needs a staff session and no venue role. A key fails with
        `unauthorized`. Grants the invitation's role in its venue. An account
        that is already a member keeps the higher of its role and the
        invited one, and never loses a role. The invitation is used up
        atomically, so of any number of concurrent redemptions one succeeds.

        An unknown id, a wrong secret, and an expired, used, or revoked
        invitation, and one bound to another email, all fail with
        `invalid_invitation`, the same answer for every cause. The response
        never names a venue except on success.

        A person without an account redeems by signing up instead, with the
        token in the `X-Invitation-Token` header on `POST
        /api/auth/sign-up/email`. That works under every `SIGNUP` mode and
        grants the same membership. A bad token fails there with `403` and
        the code `INVALID_INVITATION`. Auth routes are outside this
        contract.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The membership the invitation granted
          content:
            application/json:
              schema:
                type: object
                required: [membership]
                properties:
                  membership:
                    type: object
                    required: [venueId, role]
                    properties:
                      venueId: { type: string }
                      role: { $ref: "#/components/schemas/Role" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/online-booking:
    get:
      operationId: venue.getOnlineBooking
      summary: Read the venue's online booking settings and public booking key
      description: |
        Any role of the venue reads them, with a key or a staff session.
        `bookingKey` is null until online booking is first turned on. The
        values are the ones the venue set. The public channel applies the
        stricter of each online value and the venue's own rule, as
        `OnlineBooking` describes. Not exposed through MCP. See
        docs/adr/0017-booking-widget-and-self-service-link.md, section 5.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The online booking settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineBooking" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: venue.setOnlineBooking
      summary: Update the venue's online booking settings
      description: |
        Admin only. Any other role fails with `forbidden` and changes
        nothing. Partial update: a field that is absent keeps its value, and
        `null` clears a nullable field to its default. `bookingKey` is read
        only and is ignored in the body. Every invalid field fails with
        `invalid_request` and changes nothing, including a `confirmationMode`
        other than `auto` (`approval` is reserved until stage 14 of
        ADR-0017).

        Setting `enabled` to true needs a venue name and at least one
        service bookable online, a service named in `services` (any service
        when null) that opens on at least one of the online `weekdays`. Without
        them it fails with `online_booking_incomplete`. The first enable
        creates `bookingKey`. Turning online booking off keeps the key, and
        turning it on again uses the same key. While it is off every route
        under `/public/{bookingKey}` and the widget page answer as for an
        unknown key. Self-service links do not depend on the key or on the
        flag, so a guest keeps reading, changing and cancelling a booking
        already made.

        A save whose `theme` text color has a contrast below 4.5:1 against
        its background color succeeds and returns a `low_contrast` warning.
        A color the theme leaves out counts as the widget's built-in one
        (text `#1c1b19`, background `#ffffff`).
        A change never alters a booking that already exists. Not exposed
        through MCP.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnlineBookingUpdate" }
      responses:
        "200":
          description: The settings as stored, with any warnings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineBookingSaved" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/online-booking/rotate-key:
    post:
      operationId: venue.rotateBookingKey
      summary: Replace the venue's public booking key
      description: |
        Admin only. Any other role fails with `forbidden`. Mints a new
        `bookingKey` and retires the old one at once, with no grace period,
        so every embed of the old key answers as for an unknown key. It
        works whether online booking is on or off, and gives a venue that
        never had a key its first one, without turning online booking on.
        Self-service links keep working.

        The route takes no `Idempotency-Key`, as the config and catalog
        routes take none. A repeated call rotates again, and the end state is
        the same: one current key that no earlier embed holds. Read the
        current key with `GET /online-booking`. Not exposed through MCP.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The settings with the new key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnlineBooking" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/{reservationId}/self-service-link:
    post:
      operationId: reservation.reissueSelfServiceLink
      summary: Issue a new self-service link for a booking
      description: |
        Needs the `write` or `admin` role. A `read` role fails with
        `forbidden`. It revokes the reservation's current self-service link,
        mints a new one in the same transaction, and returns the new token
        once, so staff can read the link to a guest on the phone. It is the
        only staff route that returns a token. When `notificationsEnabled` is
        on and the contact is an email, it sends one `self_service_link`
        email for the new link.

        Only a `booked` reservation gets a link. Any other status fails with
        `invalid_transition`, so a cancelled booking never gets a new link. A
        reservation of another venue fails with `reservation_not_found`. The
        reservation's version does not change and no event is emitted,
        because the link is not reservation data.

        The engine stores only a hash of the token, so it cannot return a
        token twice. Every call, a repeat of the same `Idempotency-Key`
        included, revokes the current link and returns a new token. A key
        already used for another kind of write fails with `invalid_request`.
        Not exposed through MCP.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/reservationId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: The new token
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfServiceLinkIssued" }
        default:
          $ref: "#/components/responses/Error"

  /public/{bookingKey}:
    get:
      operationId: public.getConfig
      summary: Read the widget configuration of a venue
      description: |
        Public. Needs no credentials and reads no cookie or session. It
        returns the venue's display name, locale, theme, the public phone
        when the public profile holds one, the public profile's address
        only while that profile is enabled, the online party limits, the
        weekdays with an online service, the effective lead time and
        horizon, whether the consent question is shown, the confirmation
        mode, the venue's privacy notice URL or null, and a fresh form
        challenge. It never holds the venue id, any other address,
        `noticeAddress`, an email, a key other than the booking key in the
        path, or any booking. See
        docs/adr/0021-widget-day-status-zones-waitlist.md, section 5.

        An unknown key, a rotated key, a key that does not match the key
        format, and a venue with online booking off all give the same `404`
        with `venue_not_found`, the same body and the same headers. Every
        answer sends `Cache-Control: no-store`, because the challenge is new
        each time. Limited by `public_read`. Not exposed through MCP.
      security: []
      parameters:
        - $ref: "#/components/parameters/bookingKey"
      responses:
        "200":
          description: The widget configuration
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicConfig" }
        "404":
          $ref: "#/components/responses/PublicVenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /public/{bookingKey}/availability:
    get:
      operationId: public.availability
      summary: List the times a guest can book online for a date and party size
      description: |
        Public, with no credentials. Returns only the times a public create
        would accept now, sorted, with no service names, table ids, zones,
        counts of free covers or seats, or anything about other bookings. It
        runs the same reason functions as the staff availability and the
        create, with the online limits on top: the online services and
        weekdays, the online party limits, and the stricter of the online
        and the venue's lead time and horizon. A time that only the
        overbooking ceiling could fill is never listed.

        A start earlier than now, in the venue's time zone, is never listed,
        even when the lead time is 0 (C62). A date with no bookable time, a
        blocked date, a date already gone, a date past the horizon, and a
        party outside the online limits give an empty list, not an error.
        When the list is empty, `reason` is `past_date` for a date before
        today and `beyond_horizon` for a date past the online horizon, so a
        client can word its message; it is `null` for any other empty
        answer. A malformed date or a `partySize` that is not an
        integer of at least 1 fails with `invalid_request`. It takes no
        contact, so it cannot tell whether a contact holds bookings, and it
        does not apply the per-contact caps or the guest blocklist. An
        unknown or disabled key gives `venue_not_found` as
        `public.getConfig` does. Limited by `public_read`. Not exposed
        through MCP.
      security: []
      parameters:
        - $ref: "#/components/parameters/bookingKey"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: partySize
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The bookable times
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAvailability" }
        "404":
          $ref: "#/components/responses/PublicVenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /public/{bookingKey}/days:
    get:
      operationId: public.days
      summary: Give a status per day for a party size, over up to 14 days
      description: |
        Public, with no credentials. Returns one entry per date, ascending,
        from `from` for `days` dates. Each entry has a `status` and a
        `firstTime`. They come from the same rules as
        `public.availability` and the public create, by construction: the
        route runs the same function as `public.availability` for each date
        and maps its result. It does not count tables itself. A day status
        is a snapshot and holds no table, as availability (C3).

        The status of a date is the first that applies:
        `available` when `public.availability` for that date and party
        lists at least one time, and `firstTime` is the first of them;
        `outside_window` when it gives `past_date` or `beyond_horizon`;
        `closed` when no online service opens on the date's weekday, after
        the online `services` and `weekdays`, or the date is blocked, or
        every start of the date is already past or inside the lead time,
        so late evening today is `closed`;
        `full` otherwise, so the venue serves the date online, a start is
        still open to the clock, and no time fits this party because of
        tables, capacity or limits. `firstTime` is null except for
        `available`. A date before today in the venue's time zone, and a
        date past the effective horizon (C61), is `outside_window` on its
        own, so a range may mix it with other statuses.

        `from` defaults to today in the venue's time zone. It follows the
        date rules of C61: a value that is not a real `YYYY-MM-DD` date, or
        is outside `1900-01-01` to `9998-12-31`, fails with
        `invalid_request`. `days` defaults to 12, and a value that is not an
        integer from 1 to 14 fails with `invalid_request`. A missing
        `partySize`, or one that is not an integer of at least 1, fails with
        `invalid_request`.

        A `partySize` outside the online party limits fails with
        `invalid_request`. This differs from `public.availability`, which
        answers an empty list for such a party (C42). The config already
        publishes the limits, so the error reveals nothing, and a strip of
        `full` days would offer a waitlist the guest cannot join. A party
        inside the online limits that no service takes gets `full` on the
        dates the venue serves online, as availability gives it no time.

        The answer holds no table id, zone, service name, count of tables,
        covers or seats, or guest data. It takes no contact, so the
        per-contact caps and the guest blocklist never change it. An
        unknown, rotated, malformed or disabled key gives `venue_not_found`
        as `public.getConfig` does. Limited by `public_read` and
        `public_days`. Not exposed through MCP. See
        docs/adr/0021-widget-day-status-zones-waitlist.md.
      security: []
      parameters:
        - $ref: "#/components/parameters/bookingKey"
        - name: from
          in: query
          required: false
          description: The first date. Defaults to today in the venue's time zone.
          schema: { type: string, format: date }
        - name: days
          in: query
          required: false
          description: How many dates to answer, from `from`.
          schema: { type: integer, minimum: 1, maximum: 14, default: 12 }
        - name: partySize
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The status of each date
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicDays" }
        "404":
          $ref: "#/components/responses/PublicVenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /public/{bookingKey}/reservations:
    post:
      operationId: public.createReservation
      summary: Book online as a guest
      description: |
        Public, with no credentials. It calls the same create as the staff
        route, in one transaction, with three differences. The channel turns
        the overbooking ceiling off, the online limits apply, and the engine
        sets `bookedVia: "widget"`, `ownerPrincipal: "widget"` and
        `basis: "service"`. Attribution fields in the body are ignored. The
        booking is `booked` at once. It always holds a table, and when no
        free table combination fits the party at that time the create fails
        with `slot_taken`, whatever the venue's ceiling. A body that names
        `tables`, `zone`, `rating` or `reconfirmation` fails with
        `invalid_request`.

        The guest's contact must normalize to an email or a phone, otherwise
        `invalid_request`. The contact is held to two caps. The venue's
        `maxActivePerGuestPerDay` fails with `guest_booking_limit`. The
        online `maxOpenBookingsPerContact`, which counts the contact's future
        `booked` bookings made online, fails with `online_booking_limit`.
        When both are reached, `guest_booking_limit` comes first. The guest blocklist of ADR-0018 applies as it does to any create. The
        other failures are the staff create's: `outside_hours`,
        `lead_time_violation`, `beyond_booking_horizon`, `date_blocked`,
        `party_size_too_small` and `party_size_too_large`, with the online
        services, weekdays, party limits, lead time and horizon applied on
        top of the venue's. A start earlier than now fails with
        `lead_time_violation` even when the lead time is 0 (C62); the check
        runs on the server before the booking is written.

        Bot protection. `honeypot` must be absent or empty. `challenge` must
        be one the config route issued for this booking key, at least 3
        seconds and at most 30 minutes old, with an intact signature and a
        nonce not used in the last 30 minutes, and `solution` must solve it.
        When the operator sets `PUBLIC_CAPTCHA`, `captchaToken` must verify.
        Every one of these failures is `invalid_request`, the same answer as
        any malformed body.

        Idempotency. The `Idempotency-Key` must be a UUID, otherwise
        `invalid_request`. It is stored apart from staff keys, so it can
        replay only a public create of the same venue. A repeat of the key
        returns the booking it created, with no second booking, event or
        confirmation, and skips the challenge check. Because the engine keeps
        only a hash of the token, a repeat revokes the booking's link and
        returns a new token, and sends one `self_service_link` email when
        email is on. A repeat for a booking that is no longer `booked`
        returns it with `selfServiceToken: null` and mints nothing.

        The answer is the guest view and the self-service token, which is
        shown only here. It emits one `created` event. With
        `notificationsEnabled` on it sends the `confirmation`, carrying the
        self-service link when the contact is an email, and a `notice` to
        the venue. An unknown or disabled key gives `venue_not_found`.
        Limited by `public_booking` and `public_venue`. Not exposed through
        MCP.
      security: []
      parameters:
        - $ref: "#/components/parameters/bookingKey"
        - $ref: "#/components/parameters/publicIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicReservationCreate" }
      responses:
        "200":
          description: The booking as the guest sees it, and its self-service token
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicReservationCreated" }
        "404":
          $ref: "#/components/responses/PublicVenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /public/{bookingKey}/self-service/resend:
    post:
      operationId: public.resendSelfServiceLink
      summary: Ask for new self-service links by email
      description: |
        Public, with no credentials. Stage 12 of ADR-0017, gated on email
        being on. It always answers `202` with the same body and headers,
        whether or not a booking matches, and does its work after the
        answer. When `notificationsEnabled` is on and the normalized email
        matches future `booked` bookings of the venue, it rotates each one's
        link and sends the new links in a `self_service_link` email to the
        address stored on the booking. Otherwise it does nothing. At most
        one email per address and venue every 15 minutes, a reservation in
        at most 3 of them, and at most 5 bookings in one, the earliest
        first; a booking left out keeps its link (C51). A body without one
        email address fails with `invalid_request`. An unknown or disabled
        key gives `venue_not_found`. Limited by `public_booking` and
        `public_venue`. The config's `linkResend` says whether the resend
        can send. Not exposed through MCP.
      security: []
      parameters:
        - $ref: "#/components/parameters/bookingKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "202":
          description: Accepted, whether or not a booking matched
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean, enum: [true] }
        "404":
          $ref: "#/components/responses/PublicVenueNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /public/self-service:
    get:
      operationId: public.readBooking
      summary: Read the booking a self-service token names
      description: |
        Public. The token in `X-Self-Service-Token` is the only credential,
        and it names one reservation of one venue. No route takes a venue id
        or a reservation id. Returns the guest view. Reading works until the
        link expires, 48 hours after the booking ends, or is revoked, also
        after a staff cancel and after the start time.

        A missing or malformed token, an unknown link id, a wrong secret, an
        expired or revoked link, and a link of an erased booking all fail
        with `404` and `self_service_link_invalid`, the same body and
        headers. Every answer, a failure included, sends
        `Cache-Control: no-store`. Limited by `public_read` and
        `self_service`. Not exposed through MCP.
      security: []
      parameters:
        - $ref: "#/components/parameters/selfServiceToken"
      responses:
        "200":
          description: The booking as the guest sees it
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicReservation" }
        "404":
          $ref: "#/components/responses/SelfServiceLinkInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /public/self-service/modify:
    post:
      operationId: public.modifyBooking
      summary: Change the party size, note or consent of the booking a token names
      description: |
        Public, with the token in `X-Self-Service-Token`. It calls the same
        modify as the staff route, so a change bumps the version by one and
        emits one `modified` event, and the same value changes nothing. Only
        `partySize`, `commentary` and `guest.consent` can change. A body that
        names `date`, `time`, `tables`, `zone`, `rating` or `reconfirmation`
        fails with `invalid_request`. To move a booking a guest cancels and
        books again.

        The checks run in this order. A malformed body or an
        `Idempotency-Key` that is not a UUID fails with `invalid_request`. A
        token that does not work fails with `self_service_link_invalid`. A
        repeat of the key returns the result of the first call. A booking
        that is not `booked`, or that starts within `selfServiceCutoffMinutes`
        of now, fails with `self_service_closed`. A `version` other than the
        stored one fails with `reservation_changed`. Then the rules: a party
        size outside the online party limits or the service limits fails
        with `party_size_too_small` or `party_size_too_large`, and a party
        that no free table combination fits fails with `no_suitable_table`,
        because the public channel never uses the overbooking ceiling.

        A modify does not rotate the link and does not change attribution.
        With `notificationsEnabled` on, a change of the party size sends one
        `confirmation` for the new version, with no link, within a limit per
        reservation: at most 3 such confirmations, at least 15 minutes apart
        (C60). A modify past the limit, and one that changes nothing, still
        answers as usual and sends nothing. Limited by
        `self_service`. Not exposed through MCP.
      security: []
      parameters:
        - $ref: "#/components/parameters/selfServiceToken"
        - $ref: "#/components/parameters/publicIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicReservationModify" }
      responses:
        "200":
          description: The booking after the change
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicReservation" }
        "404":
          $ref: "#/components/responses/SelfServiceLinkInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /public/self-service/cancel:
    post:
      operationId: public.cancelBooking
      summary: Cancel the booking a token names
      description: |
        Public, with the token in `X-Self-Service-Token`. It calls the same
        cancel as the staff route, frees the tables, bumps the version and
        emits one `cancelled` event. In the same transaction it revokes the
        link and mints no new one. The answer is the cancelled guest view,
        the last answer the link gives, with no token. With
        `notificationsEnabled` on it sends a `cancellation`, with no link,
        to the guest and a `notice` to the venue.

        The checks run in the order of `public.modifyBooking`, with no
        version check. A booking that is not `booked`, a staff cancel
        included, or that starts within `selfServiceCutoffMinutes`, fails
        with `self_service_closed`.

        Replay. A repeat of the same cancel, with the same `Idempotency-Key`
        and the same token, returns the stored result, the same cancelled
        guest view, although the cancel revoked that token. It changes
        nothing, emits no event and sends no email. It works until the link
        would have expired. Any other call with the revoked token, a read, a
        modify, or a cancel with another key, fails with
        `self_service_link_invalid`. Limited by `self_service`. Not exposed
        through MCP.
      security: []
      parameters:
        - $ref: "#/components/parameters/selfServiceToken"
        - $ref: "#/components/parameters/publicIdempotencyKey"
      responses:
        "200":
          description: The cancelled booking as the guest sees it
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicReservation" }
        "404":
          $ref: "#/components/responses/SelfServiceLinkInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /w/embed.js:
    servers:
      - url: /
        description: The widget origin (`WIDGET_ADDRESS`), not under `/v1`.
    get:
      operationId: widget.embedScript
      summary: The optional script that frames the widget page and sets its height
      description: |
        Not JSON. A venue's page loads it with
        `<script src="https://book.example.com/w/embed.js" data-key="pk_..." async></script>`.
        The script adds an iframe of `widget.page` for `data-key` right after
        its own tag, on the origin the script was loaded from, and adds
        nothing when `data-key` is not a booking key. `data-title` sets the
        iframe's title, which is `Book a table` when absent.

        Height message. The framed widget page, and only it, posts
        `{"type": "opencovers:height", "height": <number>}` to its parent,
        with the target origin `*`, on load and when its height changes. The
        message has no other key and never carries guest data. The script
        uses a message only when its `origin` is the widget origin, its
        `source` is the script's own iframe, and its data has exactly those
        two keys with that `type` and a finite `height` not below 0. It sets
        the iframe's height to that value rounded up, kept between 100 and
        6000 pixels, and ignores every other message.

        Served on the hosts `widget.page` is served on, and a request for any
        other host, or to a production API without `WIDGET_ADDRESS`, gets a
        plain `404`. No credentials, no cookie, no CORS header (a plain
        `<script>` needs none), not rate limited.
        Not exposed through MCP.
      security: []
      responses:
        "200":
          description: The script
          headers:
            Content-Type:
              schema: { type: string, enum: [text/javascript; charset=utf-8] }
            Cache-Control:
              description: The URL has no version, so the cache is short and revalidates by `ETag`.
              schema: { type: string, enum: ["public, max-age=300"] }
            ETag:
              description: A hash of the script's content.
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
            Cross-Origin-Resource-Policy:
              schema: { type: string, enum: [cross-origin] }
          content:
            text/javascript:
              schema: { type: string }
        "304":
          description: "`If-None-Match` names the current `ETag`."
        "404":
          description: A host other than the widget's, a production API without `WIDGET_ADDRESS`, or no widget build.
          content:
            text/plain:
              schema: { type: string }

  /w/{bookingKey}:
    servers:
      - url: /
        description: The widget origin (`WIDGET_ADDRESS`), not under `/v1`.
    get:
      operationId: widget.page
      summary: The widget page, an HTML shell to embed in an iframe or open top-level
      description: |
        Not JSON. The API serves a small HTML shell that loads the widget's
        hashed assets from `/w/assets/`, which the API also serves, with a
        long `Cache-Control`. It needs no credentials, sets no cookie, and is
        not rate limited. In production it is served only from the widget
        origin, never from the staff app's origin: with `WIDGET_ADDRESS` set
        the API answers only requests for that host, and without it a
        production API serves no widget page. In local development the staff
        app's dev server proxies `/w/*` to the API.

        Framing. The answer sends no `X-Frame-Options`. Its
        `Content-Security-Policy` has `frame-ancestors 'self'` followed by
        the venue's `allowedOrigins`, or `frame-ancestors 'none'` when the
        list is empty, so the page then works only top-level. The rest of the
        policy is `default-src 'self'; script-src 'self'; connect-src 'self';
        img-src 'self' https: data:; style-src 'self' 'unsafe-inline';
        base-uri 'none'; form-action 'self'; object-src 'none'`, plus the
        CAPTCHA vendor's hosts when the operator sets `PUBLIC_CAPTCHA`. It
        also sends `X-Robots-Tag: noindex`, `Referrer-Policy: no-referrer`
        and `X-Content-Type-Options: nosniff`, and the HTML holds
        `<meta name="robots" content="noindex">`. The page never emits
        JSON-LD.

        An unknown key, a rotated key and a venue with online booking off get
        the same `404` HTML page and headers, with `frame-ancestors 'none'`,
        and so does a request for a host other than `WIDGET_ADDRESS`.
        Not exposed through MCP.
      security: []
      parameters:
        - $ref: "#/components/parameters/bookingKey"
        - name: lang
          in: query
          required: false
          description: A supported widget locale (`es`, `en`, `ca`, `fr`, `de`, `it`, `pt`). It wins over the venue's `locale`. Any other value is ignored.
          schema: { type: string, example: en }
      responses:
        "200":
          description: The widget HTML shell
          headers:
            Content-Security-Policy:
              description: With `frame-ancestors` built from the venue's `allowedOrigins`.
              schema: { type: string }
            X-Robots-Tag:
              schema: { type: string, enum: [noindex] }
            Referrer-Policy:
              schema: { type: string, enum: [no-referrer] }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Unknown, rotated or disabled key. The same page and headers, with `frame-ancestors 'none'`.
          headers:
            Content-Security-Policy:
              schema: { type: string }
          content:
            text/html:
              schema: { type: string }

  /r:
    servers:
      - url: /
        description: The widget origin (`WIDGET_ADDRESS`), not under `/v1`.
    get:
      operationId: widget.selfServicePage
      summary: The self-service page, where a guest views, changes or cancels one booking
      description: |
        Not JSON. The guest's link is `/r#<token>`. The token rides in the
        fragment, which the browser never sends, so this route never sees it
        and answers the same HTML shell for every booking. The page reads the
        token from the fragment, removes the fragment from the address bar,
        keeps the token in memory only, and calls the self-service routes
        with it in `X-Self-Service-Token`. A link that does not work shows
        one message whatever the reason.

        The shell loads the same widget build as `widget.page`, from
        `/w/assets/`, sets no cookie, and is not rate limited. It is served
        on the hosts `widget.page` is served on, and a request for any other
        host gets the `404` page of `widget.page`. It is never framed: it
        sends `X-Frame-Options: DENY` and the policy of `widget.page` with
        `frame-ancestors 'none'`, whatever any venue allows. It also sends
        `Cache-Control: no-store`, `X-Robots-Tag: noindex`,
        `Referrer-Policy: no-referrer` and `X-Content-Type-Options: nosniff`,
        and the HTML holds `<meta name="robots" content="noindex">`.
        Not exposed through MCP.
      security: []
      parameters:
        - name: lang
          in: query
          required: false
          description: A supported widget locale for the page (`es`, `en`, `ca`, `fr`, `de`, `it`, `pt`). Without it the page uses the venue's `locale` from the guest view. Any other value is ignored.
          schema: { type: string, example: en }
      responses:
        "200":
          description: The self-service HTML shell
          headers:
            Content-Security-Policy:
              description: The `widget.page` policy with `frame-ancestors 'none'`.
              schema: { type: string }
            X-Frame-Options:
              schema: { type: string, enum: [DENY] }
            X-Robots-Tag:
              schema: { type: string, enum: [noindex] }
            Referrer-Policy:
              schema: { type: string, enum: [no-referrer] }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            text/html:
              schema: { type: string }
        "404":
          description: A host other than the widget's. The `404` page and headers of `widget.page`.
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: |
        The key that identifies the caller and the channel. A staff session
        with a per-venue role is accepted the same way. A `read` key or role
        reads. A `write` key or role also creates, modifies, cancels, and
        moves reservations, runs the waitlist, manages webhooks, and erases.
        Venue configuration, services, tables, floor items, API keys, and
        guest merges need `admin`. Any other role fails with `forbidden`.
        Members, invitations, and the guest blocklist need an `admin` staff
        session, and refuse every key with `forbidden`.

  parameters:
    venueId:
      name: venueId
      in: path
      required: true
      schema: { type: string }
      description: The venue slug.
    reservationId:
      name: reservationId
      in: path
      required: true
      schema: { type: string }
    guestId:
      name: guestId
      in: path
      required: true
      schema: { type: string }
      description: The guest record id.
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: |
        A client-generated key, scoped to the venue. Repeating it returns the
        original result with no second write, and a duplicate sent while the
        first is running waits for it. A key used for another kind of write
        or another target fails with `invalid_request`. A write that fails
        stores no key, so the same key can be sent again.
    optionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: |
        The same key as `idempotencyKey`, with the same semantics. Optional
        here because these routes took no key before and existing callers
        send none. A call without it is not deduplicated.
    entryId:
      name: entryId
      in: path
      required: true
      schema: { type: string }
      description: The waitlist entry id.
    bookingKey:
      name: bookingKey
      in: path
      required: true
      description: |
        The venue's public booking key, `pk_` and 16 random bytes in
        base64url without padding. Public by design, it names the venue and
        authenticates nothing. A value that does not match the format is
        answered as an unknown key.
      schema: { type: string, pattern: "^pk_[A-Za-z0-9_-]{22}$", example: pk_7Hc2kQ9xLmN3pR5tV8wY1z }
    publicIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A random UUID the client generates once per submit and repeats on a
        retry. Any other value fails with `invalid_request`. The engine
        stores it under a `public:` prefix, apart from the keys of staff and
        integrations, so a public request can replay only a public request
        of the same venue.
      schema: { type: string, format: uuid }
    selfServiceToken:
      name: X-Self-Service-Token
      in: header
      required: true
      description: |
        The self-service token, `<linkId>.<secret>`: a random UUID, a dot,
        and 32 random bytes in base64url without padding. The guest's link
        carries it in the URL fragment, `/r#<token>`, which the browser
        never sends to a server, and the page sends it in this header. A
        missing or malformed value fails with `self_service_link_invalid`.
      schema:
        type: string
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\.[A-Za-z0-9_-]{43}$"

  responses:
    PublicVenueNotFound:
      description: |
        Unknown, rotated or malformed booking key, or online booking is off.
        The same body and headers for every cause. The code is
        `venue_not_found`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SelfServiceLinkInvalid:
      description: |
        The token does not work, for any cause. The same body and headers for
        every cause, with `Cache-Control: no-store`. The code is
        `self_service_link_invalid`.
      headers:
        Cache-Control:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: An error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests. The code is `rate_limited`.
      headers:
        Retry-After:
          description: Seconds to wait before the next attempt.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ReservationStatus:
      type: string
      enum: [booked, seated, attended, no_show, cancelled]

    ReservationType:
      type: string
      enum: [free, prepaid]

    AvailabilitySlot:
      type: object
      required: [time, available, type]
      properties:
        time:
          type: string
          example: "21:30"
        available:
          type: boolean
        type:
          $ref: "#/components/schemas/ReservationType"
        requiresConfirmation:
          type: boolean
          default: false

    AvailabilityExplanation:
      type: object
      required: [date, time, partySize, available, reasons, nearest]
      properties:
        date: { type: string, format: date }
        time: { type: string, example: "21:30" }
        partySize: { type: integer }
        zone:
          type: string
          description: Present when the request named a zone.
        available:
          type: boolean
        reasons:
          type: array
          description: Empty when the time is bookable.
          items: { $ref: "#/components/schemas/ExplainReason" }
        nearest:
          type: array
          maxItems: 3
          description: Available times on the same date, nearest first. Empty when the time is bookable.
          items: { type: string, example: "21:45" }

    ExplainReason:
      type: object
      description: |
        One rule that blocks the time. Reasons come in this fixed order:
        `outside_hours` with rule `hours` or `weekday`, then rule `slot_grid`, then rule
        `last_seating`, then `lead_time_violation`, then
        `beyond_booking_horizon`, then `date_blocked`, then the service limit
        as `party_size_too_small` or `party_size_too_large` with rule
        `service_limit`, then `party_size_too_large` for capacity or
        `no_suitable_table`. The codes are the error codes a create returns
        for the same rule. `no_suitable_table` is absent when the venue's
        `overbookingCeiling` leaves room for the party.
      required: [code, message, details]
      properties:
        code:
          type: string
          enum: [outside_hours, lead_time_violation, beyond_booking_horizon, date_blocked, party_size_too_small, party_size_too_large, no_suitable_table]
        message:
          type: string
          description: Human-readable. May change.
        details:
          oneOf:
            - $ref: "#/components/schemas/ExplainHours"
            - $ref: "#/components/schemas/ExplainWeekday"
            - $ref: "#/components/schemas/ExplainSlotGrid"
            - $ref: "#/components/schemas/ExplainLastSeating"
            - $ref: "#/components/schemas/ExplainLeadTime"
            - $ref: "#/components/schemas/ExplainHorizon"
            - $ref: "#/components/schemas/ExplainBlockedDate"
            - $ref: "#/components/schemas/ExplainServiceMinimum"
            - $ref: "#/components/schemas/ExplainServiceMaximum"
            - $ref: "#/components/schemas/ExplainPartySize"
            - $ref: "#/components/schemas/ExplainTables"

    ExplainHours:
      type: object
      description: Details of `outside_hours` when no service covers the time.
      required: [rule, services]
      properties:
        rule: { type: string, enum: [hours] }
        services:
          type: array
          items:
            type: object
            required: [name, openStart, openEnd]
            properties:
              name: { type: string }
              openStart: { type: string }
              openEnd: { type: string }

    ExplainWeekday:
      type: object
      description: |
        Details of `outside_hours` when a service covers the time by its hours
        but none serves the weekday of the date. A service belongs to the day
        it opens, so the weekday checked for the part of an overnight service
        after midnight is the one of the previous date, while `weekday` here is
        the one of `date`.
      required: [rule, date, weekday, services]
      properties:
        rule: { type: string, enum: [weekday] }
        date: { type: string, format: date }
        weekday: { type: integer, minimum: 1, maximum: 7 }
        services:
          type: array
          items:
            type: object
            required: [name, openStart, openEnd, days]
            properties:
              name: { type: string }
              openStart: { type: string }
              openEnd: { type: string }
              days: { $ref: "#/components/schemas/ServiceDays" }

    ExplainSlotGrid:
      type: object
      description: Details of `outside_hours` when the time is off the slot grid.
      required: [rule, service, openStart, openEnd, slotIntervalMinutes, previous, next]
      properties:
        rule: { type: string, enum: [slot_grid] }
        service: { type: string }
        openStart: { type: string }
        openEnd: { type: string }
        slotIntervalMinutes: { type: integer }
        previous: { type: string, description: The grid time before the requested time. }
        next:
          type: string
          nullable: true
          description: The grid time after the requested time, or null when it is past the last seating.

    ExplainLastSeating:
      type: object
      description: Details of `outside_hours` when the time is after the last seating.
      required: [rule, service, openEnd, lastSeatingOffsetMinutes, lastSeating]
      properties:
        rule: { type: string, enum: [last_seating] }
        service: { type: string }
        openEnd: { type: string }
        lastSeatingOffsetMinutes: { type: integer }
        lastSeating: { type: string }

    ExplainHorizon:
      type: object
      description: Details of `beyond_booking_horizon`.
      required: [maxAdvanceDays, latest]
      properties:
        maxAdvanceDays: { type: integer }
        latest: { type: string, format: date, description: The last bookable date, in the venue's time zone. }

    ExplainBlockedDate:
      type: object
      description: Details of `date_blocked`. The blocked range that holds the date.
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }

    ExplainLeadTime:
      type: object
      description: Details of `lead_time_violation`.
      required: [leadTimeMinutes, earliest]
      properties:
        leadTimeMinutes: { type: integer }
        earliest:
          type: object
          description: The earliest bookable moment in the venue's time zone, rounded up to the minute.
          required: [date, time]
          properties:
            date: { type: string, format: date }
            time: { type: string }

    ExplainServiceMinimum:
      type: object
      description: Details of `party_size_too_small` when the party is below the minimum of the service.
      required: [rule, service, partySize, minPartySize]
      properties:
        rule: { type: string, enum: [service_limit] }
        service: { type: string }
        partySize: { type: integer }
        minPartySize: { type: integer }

    ExplainServiceMaximum:
      type: object
      description: Details of `party_size_too_large` when the party is above the maximum of the service.
      required: [rule, service, partySize, maxPartySize]
      properties:
        rule: { type: string, enum: [service_limit] }
        service: { type: string }
        partySize: { type: integer }
        maxPartySize: { type: integer }

    ExplainPartySize:
      type: object
      description: Details of `party_size_too_large` when the party is above the capacity.
      required: [partySize, largestParty]
      properties:
        partySize: { type: integer }
        largestParty: { type: integer, description: Total seats of the venue, or of the zone when one was named. }
        zone: { type: string }

    ExplainTables:
      type: object
      description: Details of `no_suitable_table`. Counts only, never table ids.
      required: [partySize, tablesFree, tablesTotal, seatsFree, largestFreeTable]
      properties:
        partySize: { type: integer }
        tablesFree: { type: integer }
        tablesTotal: { type: integer }
        seatsFree: { type: integer }
        largestFreeTable: { type: integer }
        zone: { type: string }

    Guest:
      type: object
      required: [name, contact]
      properties:
        guestId:
          type: string
          description: |
            The engine's own guest record id, when one exists. Used for erasure.
            A booking links to a guest of the same venue by an exact match on
            its normalized contact. An email is trimmed, Unicode-normalized to
            NFC, and lowercased, keeping dots and `+` tags. Anything without
            `@` is read as a phone and parsed to E.164, using the venue's
            `phoneCountry` when it has no country code. The name never takes
            part. A contact that does not normalize links no guest, and the
            booking still succeeds. Omitted when no guest is linked.
        name:
          type: string
        contact:
          type: string
          description: An email or a phone with its country code.
        principalReference:
          type: string
          description: An opaque reference to the authenticated channel, set by the engine.
        consent:
          $ref: "#/components/schemas/Consent"
        consentRecordedAt:
          type: string
          format: date-time
          description: When consent last changed to `granted` or `denied`. Omitted while consent is `unknown`.

    GuestRecord:
      type: object
      required: [id, name, email, phone, lastVisitAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
          description: The normalized email.
        phone:
          type: string
          nullable: true
          description: The normalized phone in E.164.
        lastVisitAt:
          type: string
          format: date-time
          description: |
            The start of the guest's latest reservation, never later than now:
            a booking that has not started yet counts from the moment it was
            made. Retention counts from it, and keeps a guest while any of its
            bookings that is not cancelled ends inside the retention period.

    GuestDetail:
      allOf:
        - $ref: "#/components/schemas/GuestRecord"
        - type: object
          required: [visitCount, firstVisitAt, reservations, mergedGuests]
          properties:
            visitCount:
              type: integer
              description: The number of reservations the guest holds, in any status.
            firstVisitAt:
              type: string
              format: date-time
              nullable: true
            reservations:
              type: array
              items:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                  status:
                    $ref: "#/components/schemas/ReservationStatus"
            mergedGuests:
              type: array
              description: The guests merged directly into this one. Each can be unmerged by its id.
              items:
                type: object
                required: [id, name, email, phone]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true

    Consent:
      type: string
      enum: [unknown, granted, denied]
      default: unknown
      description: |
        Whether the guest allows being contacted after the reservation.
        `unknown` means the guest was never asked. Erasure resets it to `unknown`.

    Rating:
      type: integer
      minimum: 1
      maximum: 5
      nullable: true
      description: |
        The guest's rating of the visit. Null means not given. Set by staff or
        a key with `write` on create, walk-in and modify. Null on modify clears
        it. Erasure resets it to null.

    Reconfirmation:
      type: string
      enum: [none, requested, confirmed, declined, no_answer]
      default: none
      description: |
        Where the guest stands on reconfirming the booking. `none` means no
        reconfirmation was asked, and it is the default. `requested` means
        staff or a platform asked and wait for the answer. `confirmed` means
        the guest confirmed. `declined` means the guest said they will not
        come. `no_answer` means the guest was asked and did not answer.

        The engine only stores the signal. It does not send a reconfirmation
        request, and `declined` does not cancel the booking or free its
        tables, so staff cancel it by hand. It is set on create and changed
        on modify while the booking is `booked`. A walk-in does not take it
        and fails with `invalid_request`. Erasure resets it to `none`.

    Commentary:
      type: string
      maxLength: 500
      description: |
        A short note for staff about this booking, up to 500 characters after
        trimming, such as "anniversary, bring a cake". Empty means no note. On
        modify, an empty string clears it. Erasure clears it.

        It is not for health data. Do not record allergies, medical
        conditions, or diet needs in it. The engine does not process health
        data yet, and it cannot tell that a note holds some. Those fields wait
        for a legal review and a guest-level model.

    GuestModify:
      type: object
      properties:
        consent:
          $ref: "#/components/schemas/Consent"

    Reservation:
      type: object
      required:
        - id
        - venueId
        - date
        - time
        - service
        - partySize
        - status
        - version
      properties:
        id:
          type: string
        venueId:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        service:
          type: string
        partySize:
          type: integer
        durationMinutes:
          type: integer
        tables:
          type: array
          description: |
            The ids of the tables the reservation holds, sorted ascending. It
            keeps the tables of an attended or no-show visit and is empty once
            the reservation is cancelled. It is also empty while a booking
            accepted under the venue's `overbookingCeiling` waits for tables.
          items: { type: string }
        zone:
          type: string
        guest:
          $ref: "#/components/schemas/Guest"
        rating:
          $ref: "#/components/schemas/Rating"
        ratingRecordedAt:
          type: string
          format: date-time
          nullable: true
          description: When the rating last changed. Null while `rating` is null.
        commentary:
          $ref: "#/components/schemas/Commentary"
        reconfirmation:
          $ref: "#/components/schemas/Reconfirmation"
        reconfirmationRecordedAt:
          type: string
          format: date-time
          nullable: true
          description: When the reconfirmation last changed. Null while `reconfirmation` is `none`.
        status:
          $ref: "#/components/schemas/ReservationStatus"
        type:
          $ref: "#/components/schemas/ReservationType"
        version:
          type: integer
          minimum: 1
        basis:
          type: string
          description: Set by the engine from the authenticated channel.
        ownerPrincipal:
          type: string
          description: Set by the engine. `widget` for a booking made through the public channel.
        bookedVia:
          type: string
          description: Set by the engine. `widget` for a booking made through the public channel.
        source:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReservationCreate:
      type: object
      required: [date, time, partySize]
      properties:
        date:
          type: string
          format: date
        time:
          type: string
        partySize:
          type: integer
          minimum: 1
        service:
          type: string
          description: When omitted, the engine derives it from the time.
        zone:
          type: string
        tables:
          type: array
          description: |
            When set, the engine must use these tables. When empty or omitted,
            the engine assigns the tables. See the conformance cases for the
            conflict behavior.
          items: { type: string }
        guest:
          $ref: "#/components/schemas/Guest"
        rating:
          $ref: "#/components/schemas/Rating"
        source:
          type: string
        commentary:
          $ref: "#/components/schemas/Commentary"
        reconfirmation:
          $ref: "#/components/schemas/Reconfirmation"

    ReservationModify:
      type: object
      minProperties: 1
      properties:
        date:
          type: string
          format: date
        time:
          type: string
        partySize:
          type: integer
          minimum: 1
        zone:
          type: string
        tables:
          type: array
          items: { type: string }
        guest:
          $ref: "#/components/schemas/GuestModify"
        rating:
          $ref: "#/components/schemas/Rating"
        commentary:
          $ref: "#/components/schemas/Commentary"
        reconfirmation:
          $ref: "#/components/schemas/Reconfirmation"

    Event:
      type: object
      required: [id, type, reservationId, version, occurredAt]
      properties:
        id:
          type: string
          description: Stable and monotonic within a venue.
        type:
          type: string
          enum: [created, modified, cancelled, seated, attended, no_show, erased]
        reservationId:
          type: string
        version:
          type: integer
        tombstoneHash:
          type: string
          description: Present on `erased` events. A hash of the reservation id, never a personal value.
        occurredAt:
          type: string
          format: date-time

    Role:
      type: string
      enum: [read, write, admin]

    Member:
      type: object
      required: [userId, name, email, role]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    MembershipAuditEntry:
      type: object
      required: [id, action, actorUserId, targetUserId, invitationId, role, blocklistEntryId, occurredAt]
      properties:
        id: { type: string }
        action:
          type: string
          enum:
            [
              invited,
              invite_revoked,
              redeemed,
              member_removed,
              role_changed,
              creator_transferred,
              guest_blocked,
              guest_unblocked,
            ]
        actorUserId: { type: string, nullable: true }
        targetUserId:
          type: string
          nullable: true
          description: |
            The account that redeemed, the member removed, the member whose
            role changed, or the new creator.
        invitationId: { type: string, nullable: true }
        role:
          type: string
          nullable: true
          description: The new role for `role_changed`. Null for `creator_transferred`.
        blocklistEntryId:
          type: string
          nullable: true
          description: |
            The entry added or removed, for `guest_blocked` and
            `guest_unblocked`. Null for every other action.
        occurredAt: { type: string, format: date-time }

    BlocklistReason:
      type: string
      nullable: true
      enum: [no_show, late_cancellation, conduct, other, null]
      description: A code, never free text. Null or absent means no reason.

    BlocklistSubject:
      type: object
      description: Exactly one of `guestId` or `contact`.
      properties:
        guestId:
          type: string
          minLength: 1
          description: A guest record id. Covers the guests merged into it.
        contact:
          type: string
          minLength: 1
          description: An email or a phone, normalized as a booking contact is.

    BlocklistEntry:
      type: object
      required: [id, kind, reason, createdBy, createdAt, expiresAt, active]
      description: Never holds the contact or its hash.
      properties:
        id: { type: string }
        kind: { type: string, enum: [email, phone] }
        reason: { $ref: "#/components/schemas/BlocklistReason" }
        createdBy:
          type: string
          description: The account id of the admin who added it.
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: |
            `createdAt` plus the venue's `retentionDays`. Retention deletes
            the entry after it.
        active:
          type: boolean
          description: |
            False when the entry was made under a key that is no longer
            configured, so it matches no booking. An admin removes it and
            adds the contact again.

    WaitlistEntry:
      type: object
      required: [id, venueId, partySize, zone, guestName, guestContact, status, reservationId, createdAt]
      properties:
        id: { type: string }
        venueId: { type: string }
        partySize: { type: integer }
        zone: { type: string }
        guestName: { type: string }
        guestContact: { type: string }
        status: { type: string, enum: [waiting, seated, cancelled] }
        reservationId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    WaitlistEntries:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/WaitlistEntry" }

    Invitation:
      type: object
      required: [id, role, email, status, createdAt, expiresAt, redeemedAt, revokedAt]
      properties:
        id: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        email:
          type: string
          nullable: true
          description: The address the invitation is bound to, or null for an open link.
        status:
          type: string
          enum: [pending, redeemed, revoked, expired]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        redeemedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }

    InvitationCreated:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Shown once. The engine keeps only a hash of its secret.

    Webhook:
      type: object
      required: [id, url, enabled, failures, lastError, nextAttemptAt, creatorDepartedAt]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        creatorDepartedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Set when the staff member who registered the endpoint was removed
            from the venue. The endpoint keeps delivering, so review it. Null
            for endpoints made by someone still a member, made with a key, or
            made before ADR-0011.
        enabled:
          type: boolean
        failures:
          type: integer
          minimum: 0
          description: Consecutive failed attempts. Reset to 0 by a successful delivery.
        lastError:
          type: string
          nullable: true
          description: The most recent delivery error, or the range of events dropped by retention.
        nextAttemptAt:
          type: string
          format: date-time

    WebhookCreated:
      type: object
      required: [id, url, enabled, secret]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        secret:
          type: string
          description: |
            32 random bytes, base64url. The HMAC-SHA256 key for
            `OpenCovers-Signature`. Returned only once, in this response.

    WebhookPayload:
      description: |
        The body of each webhook POST. It is the `Event` plus `venueId`. The
        request carries `OpenCovers-Event-Id` (the event id) and
        `OpenCovers-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of
        "<t>.<raw body>" keyed by the secret>`. Delivery is at least once and
        in event id order. Deduplicate on `id`.
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          required: [venueId]
          properties:
            venueId:
              type: string

    PublicProfile:
      type: object
      description: |
        The venue's public data. Separate from the private configuration.
        Every field is nullable except the flag. See docs/adr/0012-public-profile-jsonld.md.
      properties:
        publicProfileEnabled: { type: boolean, default: false }
        street: { type: string, nullable: true, maxLength: 200 }
        locality: { type: string, nullable: true, maxLength: 100 }
        postalCode: { type: string, nullable: true, maxLength: 20 }
        region: { type: string, nullable: true, maxLength: 100 }
        country:
          type: string
          nullable: true
          example: ES
          description: ISO 3166-1 alpha-2, upper case.
        phone: { type: string, nullable: true, maxLength: 30, example: "+34 910 000 000" }
        websiteUrl: { type: string, nullable: true, format: uri, maxLength: 2048, description: https only. }
        bookingUrl:
          type: string
          nullable: true
          format: uri
          maxLength: 2048
          description: https only. Adds a ReserveAction to the JSON-LD.
        cuisine: { type: string, nullable: true, maxLength: 100 }
        priceRange: { type: string, nullable: true, enum: ["$", "$$", "$$$", "$$$$", null] }
        latitude: { type: number, nullable: true, minimum: -90, maximum: 90 }
        longitude: { type: number, nullable: true, minimum: -180, maximum: 180 }

    RestaurantJsonLd:
      type: object
      required: ["@context", "@type", name, address]
      properties:
        "@context": { type: string, enum: ["https://schema.org"] }
        "@type": { type: string, enum: [Restaurant] }
        name: { type: string }
        address: { type: object }
        url: { type: string }
        telephone: { type: string }
        servesCuisine: { type: string }
        priceRange: { type: string }
        geo: { type: object }
        openingHoursSpecification: { type: array, items: { type: object } }
        potentialAction: { type: object }

    VenueConfig:
      type: object
      required: [enabled, noticeAddress]
      properties:
        enabled:
          type: boolean
        noticeAddress:
          type: string
          description: Required to enable the venue and cannot be cleared while enabled.
        phoneCountry:
          type: string
          nullable: true
          example: ES
          description: |
            ISO 3166 alpha-2 country used to read a guest phone without a
            country code. Null means the country of the venue's time zone.
        turnTimes:
          type: array
          maxItems: 10
          description: |
            How long a booking holds its tables, by party size. A party uses
            the first row whose `upTo` is at least its size, or the last row
            when it is larger. `upTo` strictly increases from row to row.
            Absent when the venue has none, and then a booking holds its
            tables for 120 minutes. An empty array clears it.
          items:
            type: object
            required: [upTo, minutes]
            additionalProperties: false
            properties:
              upTo: { type: integer, minimum: 1 }
              minutes: { type: integer, minimum: 15, maximum: 480 }
          example:
            - { upTo: 2, minutes: 90 }
            - { upTo: 4, minutes: 120 }
            - { upTo: 8, minutes: 150 }
        overbookingCeiling:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: |
            The most covers, counted as party sizes, that the venue accepts
            without tables at any one time. At 0 every booking holds tables.
            Above 0, a booking that fits the venue but finds no free table
            combination is accepted with no tables when the covers of every
            active booking without tables that overlaps it, plus its own
            party, stay within the ceiling. Such a booking has `tables: []`
            until staff assign tables with a modify, and the database still
            refuses any table that another booking holds. The ceiling never
            applies to a walk-in, to a booking that names its tables, or to a
            party larger than the venue. It is venue-wide, whatever the zone.
        maxAdvanceDays:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000
          default: null
          description: |
            The furthest date, in days after today in the venue's time zone,
            that a booking may name. A booking on that day passes and one a
            day later fails with `beyond_booking_horizon`. Null, the default,
            sets no limit. A walk-in is not held to it.
        maxActivePerGuestPerDay:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100
          default: null
          description: |
            The most active (booked or seated) bookings that one guest may
            hold on one local date, counted by the guest record that the
            contact resolves to. A create over the cap fails with
            `guest_booking_limit`. Null, the default, sets no limit.
            Availability and the explanation are anonymous, so they do not
            apply it. A booking without a usable contact is not counted, and
            a walk-in is not held to it.
        blockedDates:
          type: array
          maxItems: 366
          default: []
          description: |
            Dates on which the venue takes no bookings, in its time zone. A
            write takes each entry as a `YYYY-MM-DD` date or a `{ from, to }`
            range, both inclusive, and replaces the list. An empty array
            clears it. Overlapping and adjacent entries are merged, and a read
            returns sorted `{ from, to }` ranges. A blocked date fails a
            create with `date_blocked`, and availability shows its times as
            unavailable. A walk-in is not held to it.
          items:
            type: object
            required: [from, to]
            additionalProperties: false
            properties:
              from: { type: string, format: date }
              to: { type: string, format: date }
          example:
            - { from: "2026-12-24", to: "2026-12-26" }

    ServiceDays:
      type: array
      minItems: 1
      maxItems: 7
      uniqueItems: true
      items: { type: integer, minimum: 1, maximum: 7 }
      description: ISO weekdays the service opens on, 1 (Monday) to 7 (Sunday). All seven when not set.
      example: [4, 5, 6]

    Service:
      type: object
      required: [name, openStart, openEnd, days]
      properties:
        days: { $ref: "#/components/schemas/ServiceDays" }
        name: { type: string }
        openStart: { type: string, example: "19:00" }
        openEnd: { type: string, example: "23:00" }
        minPartySize:
          type: integer
          minimum: 1
          description: The smallest party the service takes. Absent when there is no minimum.
        maxPartySize:
          type: integer
          minimum: 1
          description: The largest party the service takes. Absent when there is no maximum.

    ErasureResult:
      type: object
      required: [erasedReservations, erasedGuests, erasedWaitlistEntries, blocklistEntriesKept]
      properties:
        erasedReservations:
          type: integer
        erasedGuests:
          type: integer
          description: Guest records deleted.
        erasedWaitlistEntries:
          type: integer
        blocklistEntriesKept:
          type: integer
          description: |
            Guest blocklist entries of the venue that match the guests this
            erasure deleted or the contact it was given, and that stay in
            place. A repeat that deletes no guest and was given no contact
            reports 0.

    ConfirmationMode:
      type: string
      example: auto
      x-extensible-enum: [auto, approval]
      description: |
        How an online booking is confirmed. An open set of values, not a
        closed enum. `auto` means every online booking is `booked` at once
        when there is room. It is the only value a write accepts now.
        `approval` is reserved for stage 14 of ADR-0017, and a write of it,
        or of any other value, fails with `invalid_request` until then.
        Clients must accept any value on read and must treat every value
        other than `auto` as not automatic confirmation.

    WidgetLocale:
      type: string
      example: es
      x-extensible-enum: [es, en, ca, fr, de, it, pt]
      description: |
        A widget locale: `es`, `en`, `ca`, `fr`, `de`, `it` or `pt`. More may be
        added, so clients must accept any value on read. A write of a locale
        the engine does not support fails with `invalid_request`.

    Theme:
      type: object
      additionalProperties: false
      description: |
        Validated data only, with a closed set of keys. No key takes CSS,
        HTML, script, a template or a font URL. A key that is absent uses the
        built-in default. Colors read back in lower case. An unknown key or
        an invalid value fails with `invalid_request`.
        While a theme sets no color, the widget's own pages use dark built-in
        colors for a visitor whose system asks for dark mode, and a framed
        widget does too when the embed asks with `?scheme=auto`. A theme with
        any `colors` and no dark look keeps the light built-in ones for the
        colors it leaves out, for every visitor. A dark look is any of
        `darkColors`, `darkRadius` and `darkFont`.
      properties:
        colors: { $ref: "#/components/schemas/ThemeColors" }
        darkColors:
          allOf:
            - $ref: "#/components/schemas/ThemeColors"
          description: |
            The palette for a visitor in dark mode, when the widget follows
            the visitor's setting. A key it leaves out uses the widget's dark
            built-in color, never `colors` and never the light built-in one.
            Present, even as `{}`, means the venue wants the widget's dark
            look next to its own light `colors`. Absent, a theme with any
            `colors` keeps the widget light for every visitor.
        radius:
          type: integer
          minimum: 0
          maximum: 24
          description: Corner radius in pixels.
        font:
          type: string
          enum: [system, serif, rounded]
          description: One of the font stacks shipped with the widget.
        darkRadius:
          type: integer
          minimum: 0
          maximum: 24
          description: |
            Corner radius in pixels for a visitor in dark mode, when the widget
            follows the visitor's setting. Absent, `radius` applies.
        darkFont:
          type: string
          enum: [system, serif, rounded]
          description: |
            The font stack for a visitor in dark mode. Absent, `font` applies.
        logoUrl:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
          description: |
            https only, with a host, no credentials and no whitespace or
            control characters. The widget shows it as an image with no
            referrer, and the guest's browser fetches it from that address.

    ThemeColors:
      type: object
      additionalProperties: false
      properties:
        primary: { $ref: "#/components/schemas/HexColor" }
        onPrimary: { $ref: "#/components/schemas/HexColor" }
        background: { $ref: "#/components/schemas/HexColor" }
        surface: { $ref: "#/components/schemas/HexColor" }
        text: { $ref: "#/components/schemas/HexColor" }
        muted: { $ref: "#/components/schemas/HexColor" }
        border: { $ref: "#/components/schemas/HexColor" }

    HexColor:
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
      example: "#1f6f5c"

    OnlineBooking:
      type: object
      description: |
        A venue's online booking settings. The public channel applies each
        online limit on top of the venue's own rules and never relaxes them:
        the effective lead time is the larger of `leadTimeMinutes` and the
        venue's, the effective horizon is the smaller of `maxAdvanceDays`
        and the venue's, or 365 days when both are null, the effective party limits are the narrower of the
        online and the service limits, and a time is bookable online only in
        a service named in `services` (any when null) on a weekday that is in
        both `weekdays` (all when null) and the service's own `days`.
      required:
        - enabled
        - bookingKey
        - allowedOrigins
        - services
        - weekdays
        - minPartySize
        - maxPartySize
        - leadTimeMinutes
        - maxAdvanceDays
        - selfServiceCutoffMinutes
        - maxOpenBookingsPerContact
        - confirmationMode
        - askConsent
        - locale
        - theme
      properties:
        enabled:
          type: boolean
          default: false
        bookingKey:
          type: string
          nullable: true
          readOnly: true
          pattern: "^pk_[A-Za-z0-9_-]{22}$"
          description: |
            Created on the first enable and replaced by `rotate-key`. Null
            before that. Public, not a secret.
        allowedOrigins:
          type: array
          maxItems: 10
          default: []
          description: |
            The sites allowed to frame the widget page. Each entry is
            `https://host` or `https://host:port`, exactly as the origin of
            that URL reads, so with no path, query, fragment, wildcard,
            credentials, default port `:443` or trailing slash. The host is
            letters, digits, hyphens and dots only (an international name in
            its `xn--` form), and reads back in lower case. Any other value,
            `;`, `,`, quotes and spaces included, fails with
            `invalid_request`. The widget page leaves out of its
            `frame-ancestors` any stored entry that does not pass this check. Duplicates are merged. An empty list allows only
            top-level use. These origins are for framing only. The JSON
            routes send no CORS headers.
          items:
            type: string
            pattern: "^https://[^/?#@*\\s:]+(:[0-9]{1,5})?$"
            example: https://www.example.com
        services:
          type: array
          nullable: true
          default: null
          minItems: 1
          items: { type: string }
          description: |
            The names of the services bookable online, or null for all. A
            name that is not a service of the venue fails with
            `invalid_request`. A service deleted later stops being bookable.
        weekdays:
          type: array
          nullable: true
          default: null
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
          description: |
            ISO weekdays bookable online, 1 (Monday) to 7 (Sunday), or null
            for all. A day is bookable only when the service also opens on it.
        minPartySize:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        maxPartySize:
          type: integer
          minimum: 1
          maximum: 100
          default: 8
          description: At least `minPartySize`, otherwise `invalid_request`.
        leadTimeMinutes:
          type: integer
          minimum: 0
          maximum: 10080
          default: 0
        maxAdvanceDays:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1000
          default: null
          description: |
            The online horizon in days. The public channel uses the smaller of
            this and the venue's `maxAdvanceDays`. When both are null it uses
            365 days, a default that never loosens a value either of them sets
            (ADR-0017, amendment of 2026-11-17).
        selfServiceCutoffMinutes:
          type: integer
          minimum: 0
          maximum: 10080
          default: 120
          description: |
            A guest modify or cancel through the link fails with
            `self_service_closed` from this many minutes before the start.
        maxOpenBookingsPerContact:
          type: integer
          nullable: true
          minimum: 1
          maximum: 20
          default: 2
          description: |
            The most future `booked` bookings made online that one contact,
            by its normalized key, may hold in the venue. A public create over
            it fails with `online_booking_limit`. Bookings staff made are not
            counted. Null sets no limit.
        confirmationMode:
          $ref: "#/components/schemas/ConfirmationMode"
        askConsent:
          type: boolean
          default: false
          description: |
            Whether the widget shows the contact-consent question. Off, the
            public channel records no consent and the booking reads
            `unknown`. The consent text waits for legal review (REQ-N4).
        locale:
          $ref: "#/components/schemas/WidgetLocale"
        theme:
          $ref: "#/components/schemas/Theme"
        privacyNoticeUrl:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          default: null
          description: |
            The venue's own privacy notice. https only, with a host, no
            credentials and no whitespace or control characters, at most
            2048 characters. Any other value fails with `invalid_request` and
            changes nothing. `null` clears it. The public config returns it,
            and the widget then shows a link to it next to the submit button.
            OpenCovers writes no legal text (ADR-0021, section 5). Not yet
            in `required`: stage 8 of ADR-0021 adds it there together with
            the API that returns it, so the shape test stays true meanwhile.

    OnlineBookingUpdate:
      type: object
      minProperties: 1
      description: |
        A partial update of `OnlineBooking`. Absent fields keep their value,
        `null` resets a nullable field, and `theme: null` resets the theme
        to the built-in defaults. A `theme` object replaces the stored one.
        `bookingKey` is ignored.
      properties:
        enabled: { type: boolean }
        allowedOrigins: { type: array, maxItems: 10, items: { type: string } }
        services: { type: array, nullable: true, minItems: 1, items: { type: string } }
        weekdays:
          type: array
          nullable: true
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        minPartySize: { type: integer, minimum: 1, maximum: 100 }
        maxPartySize: { type: integer, minimum: 1, maximum: 100 }
        leadTimeMinutes: { type: integer, minimum: 0, maximum: 10080 }
        maxAdvanceDays: { type: integer, nullable: true, minimum: 0, maximum: 1000 }
        selfServiceCutoffMinutes: { type: integer, minimum: 0, maximum: 10080 }
        maxOpenBookingsPerContact: { type: integer, nullable: true, minimum: 1, maximum: 20 }
        confirmationMode: { $ref: "#/components/schemas/ConfirmationMode" }
        askConsent: { type: boolean }
        locale: { $ref: "#/components/schemas/WidgetLocale" }
        theme:
          allOf:
            - $ref: "#/components/schemas/Theme"
          nullable: true
        privacyNoticeUrl: { type: string, format: uri, nullable: true, maxLength: 2048 }

    OnlineBookingSaved:
      allOf:
        - $ref: "#/components/schemas/OnlineBooking"
        - type: object
          required: [warnings]
          properties:
            warnings:
              type: array
              description: Advice that did not stop the save. Empty when there is none.
              items:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum: [low_contrast]
                    description: The theme's text color has a contrast below 4.5:1 (WCAG AA) against its background color, either one the built-in color when the theme leaves it out.
                  message: { type: string }
                  ratio: { type: number, example: 3.2 }
                  palette:
                    type: string
                    enum: [light, dark]
                    description: |
                      The palette the contrast was measured in. `dark` is
                      reported only for a theme with `darkColors`, against
                      the widget's dark built-in text and background for a
                      key it leaves out.

    PublicVenue:
      type: object
      required: [name, locale, theme, phone, address]
      description: |
        What the widget shows about the venue. No id, email or key, and no
        address other than `address` below. `noticeAddress` never appears.
      properties:
        name:
          type: string
          description: The venue's display name.
        locale: { $ref: "#/components/schemas/WidgetLocale" }
        theme: { $ref: "#/components/schemas/Theme" }
        phone:
          type: string
          nullable: true
          description: The phone of the venue's public profile, or null when it holds none.
        address:
          type: string
          nullable: true
          example: "Calle Mayor 1, 28013 Madrid"
          description: |
            The street, postal code and locality of the venue's public
            profile (C33), as one line: `street`, then `postalCode` and
            `locality` joined by a space, separated by `, `, leaving out a
            part that is not set. Region, country and coordinates are not
            included. Null when the public profile is not enabled, or when
            it holds no street. Returned only while `publicProfileEnabled`
            is true: a venue that did not enable its public profile did not
            choose to publish its address, and a later widening is easy
            where retracting published data is not (ADR-0021, section 5).
            This differs from `phone`, which is returned whenever the
            profile holds one. Never `noticeAddress`.

    FormChallenge:
      type: object
      required: [nonce, issuedAt, difficulty, signature]
      description: |
        A proof-of-work challenge for one public create. The client sends it
        back unchanged. The signature is an HMAC under a server key over the
        nonce, the issue time, the difficulty and the booking key, so a
        challenge works only for the key it was issued for. The solution is
        a decimal counter such that SHA-256 of the UTF-8 string
        `<nonce>:<solution>` starts with `difficulty` zero bits.
      properties:
        nonce:
          type: string
          description: 16 random bytes in base64url.
        issuedAt:
          type: string
          format: date-time
        difficulty:
          type: integer
          minimum: 0
          maximum: 32
          description: The number of leading zero bits the solution must give. A measured instance setting (ADR-0017, Q7).
        signature:
          type: string

    PublicConfig:
      type: object
      required:
        - venue
        - minPartySize
        - maxPartySize
        - weekdays
        - leadTimeMinutes
        - maxAdvanceDays
        - askConsent
        - confirmationMode
        - challenge
        - captcha
        - linkResend
        - privacyNoticeUrl
      properties:
        venue: { $ref: "#/components/schemas/PublicVenue" }
        minPartySize:
          type: integer
          description: The online minimum. A service may narrow it.
        maxPartySize:
          type: integer
          description: The online maximum. A service may narrow it. A larger party is sent to the venue's phone.
        weekdays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: The ISO weekdays on which at least one online service opens, ascending.
        leadTimeMinutes:
          type: integer
          description: The effective lead time, the larger of the online and the venue's.
        maxAdvanceDays:
          type: integer
          nullable: true
          description: |
            The effective horizon, the smaller of the online and the venue's,
            or 365 when both are null (C60).
        askConsent: { type: boolean }
        confirmationMode: { $ref: "#/components/schemas/ConfirmationMode" }
        challenge: { $ref: "#/components/schemas/FormChallenge" }
        captcha:
          type: object
          nullable: true
          description: Null unless the operator sets `PUBLIC_CAPTCHA`.
          required: [provider, siteKey]
          properties:
            provider: { type: string, enum: [turnstile, hcaptcha] }
            siteKey: { type: string }
        linkResend:
          type: boolean
          description: |
            Whether a lost-link resend can send an email: `notificationsEnabled`
            on, a way to send, and a widget origin to link to. The widget offers
            the resend only when true. It says nothing about any guest (C51).
        privacyNoticeUrl:
          type: string
          format: uri
          nullable: true
          description: |
            The online booking setting `privacyNoticeUrl` as stored, or null
            when the venue set none. When set, the widget links to it next to
            the submit button. When null, it shows no notice link (C64).

    PublicAvailability:
      type: object
      required: [date, partySize, times, reason]
      properties:
        date: { type: string, format: date }
        partySize: { type: integer }
        times:
          type: array
          description: The bookable local times, ascending, each listed once.
          items: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "21:30" }
        reason:
          type: [string, "null"]
          enum: [past_date, beyond_horizon, null]
          description: Why `times` is empty, when the date itself is the cause. `null` when `times` is not empty or for any other reason.

    PublicDays:
      type: object
      required: [from, partySize, days]
      description: |
        The status of each date of a range for one party size. It holds no
        table id, zone, service name, count or guest data.
      properties:
        from:
          type: string
          format: date
          description: The first date. Today in the venue's time zone when the query left it out.
        partySize: { type: integer }
        days:
          type: array
          description: One entry per date from `from`, ascending, as many as `days` asked.
          minItems: 1
          maxItems: 14
          items: { $ref: "#/components/schemas/PublicDay" }

    PublicDay:
      type: object
      required: [date, status, firstTime]
      properties:
        date: { type: string, format: date }
        status:
          type: string
          enum: [available, full, closed, outside_window]
          description: |
            `available`: availability lists a time for the date. `outside_window`:
            availability gives `past_date` or `beyond_horizon`. `closed`: no online
            service opens that day, the date is blocked, or every start of the date is
            already past or inside the lead time. `full`: the venue serves the date
            online, a start is still open to the clock, and no time fits the party.
            The first that applies wins.
        firstTime:
          type: string
          nullable: true
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "20:00"
          description: The first time availability lists for the date when `status` is `available`, otherwise null.

    PublicConsent:
      type: string
      enum: [unknown, granted]
      description: |
        The consent the public channel accepts. A ticked box sends `granted`
        and an unticked box sends `unknown`, because an untouched box is not
        a refusal. `denied` fails with `invalid_request`. It is ignored, and
        no consent is recorded, when the venue's `askConsent` is off.

    PublicReservationCreate:
      type: object
      required: [date, time, partySize, guest, challenge, solution]
      description: |
        `tables`, `zone`, `rating` and `reconfirmation` fail with
        `invalid_request`. `basis`, `ownerPrincipal`, `bookedVia`, `source`
        and `service` are ignored. There is no allergy, diet or health field.
      properties:
        date: { type: string, format: date }
        time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "21:30" }
        partySize: { type: integer, minimum: 1 }
        guest:
          type: object
          required: [name, contact]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
              description: Trimmed, 1 to 100 characters.
            contact:
              type: string
              maxLength: 254
              description: One email or one phone. It must normalize as REQ-G2 says, otherwise `invalid_request`.
            consent: { $ref: "#/components/schemas/PublicConsent" }
        commentary:
          $ref: "#/components/schemas/Commentary"
        honeypot:
          type: string
          maxLength: 0
          description: The hidden form field. Any non-empty value fails with `invalid_request`.
        challenge: { $ref: "#/components/schemas/FormChallenge" }
        solution:
          type: string
          pattern: "^[0-9]{1,16}$"
          description: The proof-of-work counter for `challenge`, in decimal.
        captchaToken:
          type: string
          description: Required, and verified, only when the operator sets `PUBLIC_CAPTCHA`.

    PublicReservationModify:
      type: object
      required: [version]
      minProperties: 2
      description: |
        `date`, `time`, `tables`, `zone`, `rating` and `reconfirmation` fail
        with `invalid_request`.
      properties:
        version:
          type: integer
          minimum: 1
          description: The version of the guest view the guest saw. Another value fails with `reservation_changed`.
        partySize: { type: integer, minimum: 1 }
        commentary: { $ref: "#/components/schemas/Commentary" }
        guest:
          type: object
          properties:
            consent: { $ref: "#/components/schemas/PublicConsent" }

    PublicReservation:
      type: object
      description: |
        The guest view of one booking. It holds no reservation id, guest id,
        table, zone, service, attribution, version history, or other
        guest's data, and the contact is masked.
      required:
        - venue
        - date
        - time
        - partySize
        - maxPartySize
        - status
        - version
        - guest
        - commentary
        - consent
        - changeableUntil
        - linkExpiresAt
      properties:
        venue: { $ref: "#/components/schemas/PublicVenue" }
        date: { type: string, format: date }
        time: { type: string, example: "21:30" }
        partySize: { type: integer }
        maxPartySize:
          type: integer
          description: The online party maximum of the venue, the same value as `PublicConfig.maxPartySize`, so a guest's change screen can stop there. A service with a narrower maximum still refuses a larger party with `party_size_too_large`.
        status: { $ref: "#/components/schemas/ReservationStatus" }
        version:
          type: integer
          minimum: 1
          description: The current version, sent back with a modify.
        guest:
          type: object
          required: [name, contact]
          properties:
            name: { type: string }
            contact:
              type: string
              description: |
                Masked. An email shows the first character of its local part,
                `***`, `@` and the domain (`a***@example.com`). A phone shows
                `***` and its last two digits (`***56`).
        commentary: { $ref: "#/components/schemas/Commentary" }
        consent: { $ref: "#/components/schemas/Consent" }
        changeableUntil:
          type: string
          format: date-time
          description: The start minus `selfServiceCutoffMinutes`. From then on a modify or cancel fails with `self_service_closed`.
        linkExpiresAt:
          type: string
          format: date-time
          description: 48 hours after the booking ends. From then on the link fails with `self_service_link_invalid`.

    PublicReservationCreated:
      type: object
      required: [reservation, selfServiceToken]
      properties:
        reservation: { $ref: "#/components/schemas/PublicReservation" }
        selfServiceToken:
          type: string
          nullable: true
          description: |
            The token for the guest's link, shown once and never stored in
            clear. Null only on a repeat for a booking that is no longer
            `booked`.

    SelfServiceLinkIssued:
      type: object
      required: [selfServiceToken, linkExpiresAt]
      properties:
        selfServiceToken:
          type: string
          description: The new token, shown once. The previous link stops working.
        linkExpiresAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        retryable:
          type: boolean
          description: |
            True when repeating the same request, unchanged, may succeed
            later. False when the caller must change something first.

    ErrorCode:
      type: string
      enum:
        - invalid_request
        - venue_not_found
        - reservation_not_found
        - guest_not_found
        - guest_merged
        - guest_not_merged
        - unmerge_unavailable
        - unauthorized
        - forbidden
        - rate_limited
        - slot_taken
        - party_size_too_large
        - party_size_too_small
        - no_suitable_table
        - table_required
        - outside_hours
        - lead_time_violation
        - beyond_booking_horizon
        - date_blocked
        - guest_booking_limit
        - booking_declined
        - email_required
        - confirmation_required
        - approval_required
        - already_cancelled
        - invalid_transition
        - idempotency_in_flight
        - unknown_outcome
        - transient
        - notice_address_required
        - public_profile_incomplete
        - stale_second_factor
        - expired_cursor
        - waitlist_entry_not_found
        - webhook_not_found
        - webhook_url_rejected
        - webhook_limit_reached
        - blocklist_entry_not_found
        - blocklist_limit_reached
        - invalid_invitation
        - invitation_not_found
        - invitation_redeemed
        - venue_creation_closed
        - member_not_found
        - last_admin
        - online_booking_incomplete
        - online_booking_limit
        - self_service_link_invalid
        - self_service_closed
        - reservation_changed
