openapi: 3.0.3
info:
  title: OpenCovers Reservations API
  version: 0.1.0
  description: |
    OpenCovers is an independent reservations engine for restaurants.
    This contract defines the HTTP API. The MCP server exposes the same
    operations with the tool ids in docs/contract/mcp.md.
    Every write carries an `Idempotency-Key` header and produces a monotonic
    version. See docs/contract/errors.md for the error vocabulary.

security:
  - ApiKeyAuth: []

paths:
  /venues/{venueId}/availability:
    get:
      operationId: reservation.availability
      summary: List bookable slots for a venue, date, and party size, grouped by service
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: partySize
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: service
          in: query
          required: false
          description: Filter to one service. When omitted, the response is grouped by service.
          schema: { type: string }
      responses:
        "200":
          description: The bookable slots, keyed by service name
          content:
            application/json:
              schema:
                type: object
                required: [availability]
                properties:
                  availability:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: "#/components/schemas/AvailabilitySlot" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/availability/explain:
    get:
      operationId: reservation.availability_explain
      summary: Explain why a time is or is not bookable for a party size
      description: |
        Evaluates the request with the same rules that decide availability
        and create. `available` is true exactly when a create for the same
        date, time, party size, and zone would succeed and the availability
        list shows the time as free. Every blocking reason is returned, in
        the order of `ExplainReason`, and a create fails with the code of the
        first. A blocked time returns up to 3 nearest available times on the
        same date, nearest first. The tables are checked for the turn time
        of the party size, as a create holds them. The answer holds no
        personal data and no table ids. Readable by any key or session that
        can read the venue.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: time
          in: query
          required: true
          schema: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "21:30" }
        - name: partySize
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: zone
          in: query
          required: false
          description: Only tables in this zone count, as in a create with `zone`.
          schema: { type: string }
      responses:
        "200":
          description: The explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailabilityExplanation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/agenda:
    get:
      operationId: reservation.agenda
      summary: List the reservations for a venue on one day, grouped by service
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: service
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The day's reservations
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations:
                    type: array
                    items: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations:
    get:
      operationId: reservation.list
      summary: List the reservations of the authenticated guest
      description: |
        The guest is derived from the authenticated principal of the channel.
        A caller with no guest principal gets an empty list.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The guest's reservations
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations:
                    type: array
                    items: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: reservation.create
      summary: Create a reservation
      description: |
        The reservation holds its tables for the venue's turn time for the
        party size, or 120 minutes when the venue has none. A party outside
        the limits of the service that covers the time fails with
        `party_size_too_small` or `party_size_too_large`. A walk-in is not
        held to the service limits, as it is not held to the slot grid or
        the lead time.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationCreate" }
      responses:
        "200":
          description: The created reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/search:
    get:
      operationId: reservation.search
      summary: Search reservations across a date range
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: dateStart
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dateEnd
          in: query
          required: true
          schema: { type: string, format: date }
        - name: status
          in: query
          required: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/ReservationStatus" }
      responses:
        "200":
          description: Matching reservations
          content:
            application/json:
              schema:
                type: object
                required: [reservations]
                properties:
                  reservations:
                    type: array
                    items: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/{reservationId}:
    get:
      operationId: reservation.get
      summary: Read one reservation
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/reservationId"
      responses:
        "200":
          description: The reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/{reservationId}/modify:
    post:
      operationId: reservation.modify
      summary: Modify a reservation, producing a new version
      description: >
        Party size and tables can change on `booked` and `seated` reservations.
        A modify that changes only `guest.consent` and/or `rating` is also
        accepted on `attended`. `cancelled` and `no_show` reject every modify
        with `invalid_transition`. A body with only consent or rating sends no
        email to the guest.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/reservationId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationModify" }
      responses:
        "200":
          description: The modified reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/{reservationId}/cancel:
    post:
      operationId: reservation.cancel
      summary: Cancel a reservation
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/reservationId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: The cancelled reservation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/reservations/{reservationId}/status:
    post:
      operationId: reservation.status
      summary: Move a reservation to a new status
      description: |
        The engine enforces the allowed transitions. An invalid transition
        fails with `invalid_transition`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/reservationId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [seated, attended, no_show]
      responses:
        "200":
          description: The reservation in its new status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/config:
    get:
      operationId: venue.getConfig
      summary: Read the venue configuration
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The venue configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueConfig" }
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: venue.setConfig
      summary: Update the venue configuration
      description: |
        Enabling the venue without a notice address fails with
        `notice_address_required`. Clearing the notice address while the
        venue is enabled fails the same way. A `phoneCountry` that is not a
        supported ISO 3166 alpha-2 code in upper case fails with
        `invalid_request`. Null clears it. Malformed `turnTimes` fail with
        `invalid_request`, and an empty array clears them. Admin only. Any
        other role fails with `forbidden`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueConfig" }
      responses:
        "200":
          description: The updated venue configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueConfig" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/services:
    get:
      operationId: venue.listServices
      summary: List the venue's services
      description: Not exposed through MCP.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The services, by opening time
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/Service" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: venue.upsertService
      summary: Create or update a service by name
      description: |
        A limit left out keeps its stored value, and null clears it. A limit
        that is not an integer of at least 1, or a minimum above the maximum
        after the update, fails with `invalid_request`. Admin only. Any other
        role fails with `forbidden`. Not exposed through MCP.
      parameters:
        - $ref: "#/components/parameters/venueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, openStart, openEnd]
              properties:
                name: { type: string, minLength: 1 }
                openStart: { type: string, example: "19:00" }
                openEnd: { type: string, example: "23:00" }
                minPartySize: { type: integer, minimum: 1, nullable: true }
                maxPartySize: { type: integer, minimum: 1, nullable: true }
      responses:
        "200":
          description: The venue's services after the update
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/Service" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/events:
    get:
      operationId: reservation.events
      summary: Poll the event feed from a cursor
      description: |
        The cursor is scoped to the venue. Events are retained for the venue's
        retention period. A cursor older than the retention period fails with
        `expired_cursor`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Events after the cursor
          content:
            application/json:
              schema:
                type: object
                required: [events, nextCursor]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
                  nextCursor:
                    type: string
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/webhooks:
    get:
      operationId: webhook.list
      summary: List the venue's webhook endpoints
      description: |
        Needs a `write` or `admin` key or session. A `read` key fails with
        `forbidden`. The secret is never returned. Not exposed through MCP.
        See docs/contract/webhooks.md.
      parameters:
        - $ref: "#/components/parameters/venueId"
      responses:
        "200":
          description: The venue's endpoints
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: webhook.create
      summary: Register a webhook endpoint
      description: |
        The URL must be https, carry no credentials, and resolve only to
        public addresses, otherwise it fails with `webhook_url_rejected`. A
        venue has at most 5 endpoints, and a sixth fails with
        `webhook_limit_reached`. The endpoint receives only events written
        after it was registered, each as a signed POST of `WebhookPayload`.
        The secret appears only in this response.
      parameters:
        - $ref: "#/components/parameters/venueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "201":
          description: The registered endpoint and its signing secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCreated" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/webhooks/{webhookId}:
    delete:
      operationId: webhook.delete
      summary: Remove a webhook endpoint
      description: |
        An id that belongs to another venue fails with `webhook_not_found`,
        the same as an unknown id.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: webhookId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The remaining endpoints
          content:
            application/json:
              schema:
                type: object
                required: [webhooks]
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/erasure:
    post:
      operationId: reservation.erasure
      summary: Erase personal data by guest id or by principal
      description: |
        Erasure returns counts. For each erased reservation the event feed
        emits an `erased` event carrying a tombstone hash. Erasure also resets
        the reservation's consent to `unknown` and its rating to null.

        `guestId` is the guest record id, as returned in `guest.guestId`.
        Erasure by guest id blanks every reservation linked to that guest and
        to any guest merged into it, unlinks them, and deletes those guest
        records. Each erased reservation keeps its date, party size, and
        status, so cover counts survive. It also deletes the venue's waitlist
        entries whose contact normalizes to one of the guest's keys. Erasing
        a guest that was merged into another also erases the reservations
        moved at that merge, which the target still holds.

        Erasure and retention clear the stored prior state of every merge
        audit entry about an erased or expired guest. The entry keeps its
        ids, action, principal, and time, and the merge can no longer be
        undone.

        Deprecated: a `guestId` that is not a guest record of the venue is
        read as a contact. The contact is normalized and erases the guest it
        matches, plus any reservation and waitlist entry whose contact equals
        it exactly. This fallback is kept for one version.

        `erasedGuests` counts the guest records deleted. A contact that
        matches no guest record reports 0, even when it erased reservations
        or waitlist entries.

        Erasure by principal blanks and unlinks every reservation owned by
        that principal. It then deletes each guest record of the venue that
        was linked to one of them, with any guest merged into it, unless that
        guest still has a reservation that is not erased. A guest with a
        visit owned by another principal stays. It does not touch the
        waitlist. `erasedGuests` counts the guest records deleted.

        A guest record also expires on its own after the venue's retention
        period, counted from its latest visit. Its reservations are blanked
        the same way and emit the same `erased` events. A reservation with no
        guest record that holds a name or contact also expires, once its end
        is older than the retention period. It is blanked the same way.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                guestId:
                  type: string
                  description: The guest record id. A contact is accepted as a deprecated fallback.
                principal:
                  type: string
      responses:
        "200":
          description: The erasure counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErasureResult" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/guests:
    get:
      operationId: guest.list
      summary: List the venue's guests
      description: |
        Any key or session that can read the venue. Guests are ordered by
        `lastVisitAt` descending, then by id. A guest merged into another, or
        whose personal fields were cleared by retention, is not listed.
        `contact` matches the normalized email or phone with the same rule as
        booking, and a contact that does not normalize matches nothing.
        `name` matches a case-insensitive name prefix. Pass `nextCursor` back
        as `cursor` for the next page. It is null on the last page. A cursor
        from another venue or a malformed one fails with `invalid_request`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - name: contact
          in: query
          required: false
          schema: { type: string }
        - name: name
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: One page of guests
          content:
            application/json:
              schema:
                type: object
                required: [guests, nextCursor]
                properties:
                  guests:
                    type: array
                    items: { $ref: "#/components/schemas/GuestRecord" }
                  nextCursor:
                    type: string
                    nullable: true
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/guests/{guestId}:
    get:
      operationId: guest.get
      summary: Read one guest with its visits
      description: |
        A guest of another venue, a guest merged into another, and a guest
        cleared by retention fail with `guest_not_found`. The visits are the
        reservations the guest holds, which include those of every guest
        merged into it.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/guestId"
      responses:
        "200":
          description: The guest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestDetail" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/guests/{guestId}/merge:
    post:
      operationId: guest.merge
      summary: Merge this guest into another
      description: |
        Admin only. Any other role fails with `forbidden`. Both guests must
        belong to the venue and hold personal data, otherwise the call fails
        with `guest_not_found`. Merging a guest into itself fails with
        `invalid_request`. A source or target already merged into another
        guest fails with `guest_merged`, so a merge can never form a cycle.

        In one transaction every reservation of this guest moves to the
        target, the target's `lastVisitAt` becomes the later of the two, and
        this guest is kept, merged into the target. A later booking with this
        guest's contact links to the target. The audit entry keeps this
        guest's prior state and the ids of the moved reservations until an
        unmerge, an erasure, or retention clears it. Repeating the
        Idempotency-Key returns the target without merging again. Reusing it
        for another merge fails with `invalid_request`.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/guestId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intoGuestId]
              properties:
                intoGuestId:
                  type: string
      responses:
        "200":
          description: The target guest after the merge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestDetail" }
        default:
          $ref: "#/components/responses/Error"

  /venues/{venueId}/guests/{guestId}/unmerge:
    post:
      operationId: guest.unmerge
      summary: Undo the latest merge of this guest
      description: |
        Admin only. Any other role fails with `forbidden`. The guest returns
        to active with its prior name and contacts. The reservations moved at
        merge time return to it. A reservation booked after the merge stays
        with the target. The target's `lastVisitAt` is recomputed from the
        reservations it still holds.

        A guest that is not merged fails with `guest_not_merged`, so a second
        unmerge fails. A merge whose audit entry is missing or was cleared by
        erasure or retention fails with `unmerge_unavailable`. A target that
        was itself merged since fails with `guest_merged`. Unmerge it first.
      parameters:
        - $ref: "#/components/parameters/venueId"
        - $ref: "#/components/parameters/guestId"
      responses:
        "200":
          description: The restored guest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestDetail" }
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: |
        The key that identifies the caller and the channel. A staff session
        with a per-venue role is accepted the same way. A `read` key or role
        reads. A `write` key or role also creates, modifies, cancels, and
        moves reservations, runs the waitlist, manages webhooks, and erases.
        Venue configuration, services, tables, floor items, API keys, and
        guest merges need `admin`. Any other role fails with `forbidden`.

  parameters:
    venueId:
      name: venueId
      in: path
      required: true
      schema: { type: string }
      description: The venue slug.
    reservationId:
      name: reservationId
      in: path
      required: true
      schema: { type: string }
    guestId:
      name: guestId
      in: path
      required: true
      schema: { type: string }
      description: The guest record id.
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string }
      description: A client-generated key. Repeating it returns the original result.

  responses:
    Error:
      description: An error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    ReservationStatus:
      type: string
      enum: [booked, seated, attended, no_show, cancelled]

    ReservationType:
      type: string
      enum: [free, prepaid]

    AvailabilitySlot:
      type: object
      required: [time, available, type]
      properties:
        time:
          type: string
          example: "21:30"
        available:
          type: boolean
        type:
          $ref: "#/components/schemas/ReservationType"
        requiresConfirmation:
          type: boolean
          default: false

    AvailabilityExplanation:
      type: object
      required: [date, time, partySize, available, reasons, nearest]
      properties:
        date: { type: string, format: date }
        time: { type: string, example: "21:30" }
        partySize: { type: integer }
        zone:
          type: string
          description: Present when the request named a zone.
        available:
          type: boolean
        reasons:
          type: array
          description: Empty when the time is bookable.
          items: { $ref: "#/components/schemas/ExplainReason" }
        nearest:
          type: array
          maxItems: 3
          description: Available times on the same date, nearest first. Empty when the time is bookable.
          items: { type: string, example: "21:45" }

    ExplainReason:
      type: object
      description: |
        One rule that blocks the time. Reasons come in this fixed order:
        `outside_hours` with rule `hours`, then rule `slot_grid`, then rule
        `last_seating`, then `lead_time_violation`, then the service limit
        as `party_size_too_small` or `party_size_too_large` with rule
        `service_limit`, then `party_size_too_large` for capacity or
        `no_suitable_table`. The codes are the error codes a create returns
        for the same rule.
      required: [code, message, details]
      properties:
        code:
          type: string
          enum: [outside_hours, lead_time_violation, party_size_too_small, party_size_too_large, no_suitable_table]
        message:
          type: string
          description: Human-readable. May change.
        details:
          oneOf:
            - $ref: "#/components/schemas/ExplainHours"
            - $ref: "#/components/schemas/ExplainSlotGrid"
            - $ref: "#/components/schemas/ExplainLastSeating"
            - $ref: "#/components/schemas/ExplainLeadTime"
            - $ref: "#/components/schemas/ExplainServiceMinimum"
            - $ref: "#/components/schemas/ExplainServiceMaximum"
            - $ref: "#/components/schemas/ExplainPartySize"
            - $ref: "#/components/schemas/ExplainTables"

    ExplainHours:
      type: object
      description: Details of `outside_hours` when no service covers the time.
      required: [rule, services]
      properties:
        rule: { type: string, enum: [hours] }
        services:
          type: array
          items:
            type: object
            required: [name, openStart, openEnd]
            properties:
              name: { type: string }
              openStart: { type: string }
              openEnd: { type: string }

    ExplainSlotGrid:
      type: object
      description: Details of `outside_hours` when the time is off the slot grid.
      required: [rule, service, openStart, openEnd, slotIntervalMinutes, previous, next]
      properties:
        rule: { type: string, enum: [slot_grid] }
        service: { type: string }
        openStart: { type: string }
        openEnd: { type: string }
        slotIntervalMinutes: { type: integer }
        previous: { type: string, description: The grid time before the requested time. }
        next:
          type: string
          nullable: true
          description: The grid time after the requested time, or null when it is past the last seating.

    ExplainLastSeating:
      type: object
      description: Details of `outside_hours` when the time is after the last seating.
      required: [rule, service, openEnd, lastSeatingOffsetMinutes, lastSeating]
      properties:
        rule: { type: string, enum: [last_seating] }
        service: { type: string }
        openEnd: { type: string }
        lastSeatingOffsetMinutes: { type: integer }
        lastSeating: { type: string }

    ExplainLeadTime:
      type: object
      description: Details of `lead_time_violation`.
      required: [leadTimeMinutes, earliest]
      properties:
        leadTimeMinutes: { type: integer }
        earliest:
          type: object
          description: The earliest bookable moment in the venue's time zone, rounded up to the minute.
          required: [date, time]
          properties:
            date: { type: string, format: date }
            time: { type: string }

    ExplainServiceMinimum:
      type: object
      description: Details of `party_size_too_small` when the party is below the minimum of the service.
      required: [rule, service, partySize, minPartySize]
      properties:
        rule: { type: string, enum: [service_limit] }
        service: { type: string }
        partySize: { type: integer }
        minPartySize: { type: integer }

    ExplainServiceMaximum:
      type: object
      description: Details of `party_size_too_large` when the party is above the maximum of the service.
      required: [rule, service, partySize, maxPartySize]
      properties:
        rule: { type: string, enum: [service_limit] }
        service: { type: string }
        partySize: { type: integer }
        maxPartySize: { type: integer }

    ExplainPartySize:
      type: object
      description: Details of `party_size_too_large` when the party is above the capacity.
      required: [partySize, largestParty]
      properties:
        partySize: { type: integer }
        largestParty: { type: integer, description: Total seats of the venue, or of the zone when one was named. }
        zone: { type: string }

    ExplainTables:
      type: object
      description: Details of `no_suitable_table`. Counts only, never table ids.
      required: [partySize, tablesFree, tablesTotal, seatsFree, largestFreeTable]
      properties:
        partySize: { type: integer }
        tablesFree: { type: integer }
        tablesTotal: { type: integer }
        seatsFree: { type: integer }
        largestFreeTable: { type: integer }
        zone: { type: string }

    Guest:
      type: object
      required: [name, contact]
      properties:
        guestId:
          type: string
          description: |
            The engine's own guest record id, when one exists. Used for erasure.
            A booking links to a guest of the same venue by an exact match on
            its normalized contact. An email is trimmed, Unicode-normalized to
            NFC, and lowercased, keeping dots and `+` tags. Anything without
            `@` is read as a phone and parsed to E.164, using the venue's
            `phoneCountry` when it has no country code. The name never takes
            part. A contact that does not normalize links no guest, and the
            booking still succeeds. Omitted when no guest is linked.
        name:
          type: string
        contact:
          type: string
          description: An email or a phone with its country code.
        principalReference:
          type: string
          description: An opaque reference to the authenticated channel, set by the engine.
        consent:
          $ref: "#/components/schemas/Consent"
        consentRecordedAt:
          type: string
          format: date-time
          description: When consent last changed to `granted` or `denied`. Omitted while consent is `unknown`.

    GuestRecord:
      type: object
      required: [id, name, email, phone, lastVisitAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
          description: The normalized email.
        phone:
          type: string
          nullable: true
          description: The normalized phone in E.164.
        lastVisitAt:
          type: string
          format: date-time
          description: The start of the guest's latest reservation. Retention counts from it.

    GuestDetail:
      allOf:
        - $ref: "#/components/schemas/GuestRecord"
        - type: object
          required: [visitCount, firstVisitAt, reservations, mergedGuests]
          properties:
            visitCount:
              type: integer
              description: The number of reservations the guest holds, in any status.
            firstVisitAt:
              type: string
              format: date-time
              nullable: true
            reservations:
              type: array
              items:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                  status:
                    $ref: "#/components/schemas/ReservationStatus"
            mergedGuests:
              type: array
              description: The guests merged directly into this one. Each can be unmerged by its id.
              items:
                type: object
                required: [id, name, email, phone]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true

    Consent:
      type: string
      enum: [unknown, granted, denied]
      default: unknown
      description: |
        Whether the guest allows being contacted after the reservation.
        `unknown` means the guest was never asked. Erasure resets it to `unknown`.

    Rating:
      type: integer
      minimum: 1
      maximum: 5
      nullable: true
      description: |
        The guest's rating of the visit. Null means not given. Set by staff or
        a key with `write` on create, walk-in and modify. Null on modify clears
        it. Erasure resets it to null.

    GuestModify:
      type: object
      properties:
        consent:
          $ref: "#/components/schemas/Consent"

    Reservation:
      type: object
      required:
        - id
        - venueId
        - date
        - time
        - service
        - partySize
        - status
        - version
      properties:
        id:
          type: string
        venueId:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        service:
          type: string
        partySize:
          type: integer
        durationMinutes:
          type: integer
        tables:
          type: array
          description: |
            The ids of the tables the reservation holds, sorted ascending. It
            keeps the tables of an attended or no-show visit and is empty once
            the reservation is cancelled.
          items: { type: string }
        zone:
          type: string
        guest:
          $ref: "#/components/schemas/Guest"
        rating:
          $ref: "#/components/schemas/Rating"
        ratingRecordedAt:
          type: string
          format: date-time
          nullable: true
          description: When the rating last changed. Null while `rating` is null.
        status:
          $ref: "#/components/schemas/ReservationStatus"
        type:
          $ref: "#/components/schemas/ReservationType"
        version:
          type: integer
          minimum: 1
        basis:
          type: string
          description: Set by the engine from the authenticated channel.
        ownerPrincipal:
          type: string
        bookedVia:
          type: string
        source:
          type: string
        commentary:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReservationCreate:
      type: object
      required: [date, time, partySize]
      properties:
        date:
          type: string
          format: date
        time:
          type: string
        partySize:
          type: integer
          minimum: 1
        service:
          type: string
          description: When omitted, the engine derives it from the time.
        zone:
          type: string
        tables:
          type: array
          description: |
            When set, the engine must use these tables. When empty or omitted,
            the engine assigns the tables. See the conformance cases for the
            conflict behavior.
          items: { type: string }
        guest:
          $ref: "#/components/schemas/Guest"
        rating:
          $ref: "#/components/schemas/Rating"
        source:
          type: string
        commentary:
          type: string

    ReservationModify:
      type: object
      minProperties: 1
      properties:
        date:
          type: string
          format: date
        time:
          type: string
        partySize:
          type: integer
          minimum: 1
        zone:
          type: string
        tables:
          type: array
          items: { type: string }
        guest:
          $ref: "#/components/schemas/GuestModify"
        rating:
          $ref: "#/components/schemas/Rating"
        commentary:
          type: string

    Event:
      type: object
      required: [id, type, reservationId, version, occurredAt]
      properties:
        id:
          type: string
          description: Stable and monotonic within a venue.
        type:
          type: string
          enum: [created, modified, cancelled, seated, attended, no_show, erased]
        reservationId:
          type: string
        version:
          type: integer
        tombstoneHash:
          type: string
          description: Present on `erased` events. A hash of the reservation id, never a personal value.
        occurredAt:
          type: string
          format: date-time

    Webhook:
      type: object
      required: [id, url, enabled, failures, lastError, nextAttemptAt]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        failures:
          type: integer
          minimum: 0
          description: Consecutive failed attempts. Reset to 0 by a successful delivery.
        lastError:
          type: string
          nullable: true
          description: The most recent delivery error, or the range of events dropped by retention.
        nextAttemptAt:
          type: string
          format: date-time

    WebhookCreated:
      type: object
      required: [id, url, enabled, secret]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        secret:
          type: string
          description: |
            32 random bytes, base64url. The HMAC-SHA256 key for
            `OpenCovers-Signature`. Returned only once, in this response.

    WebhookPayload:
      description: |
        The body of each webhook POST. It is the `Event` plus `venueId`. The
        request carries `OpenCovers-Event-Id` (the event id) and
        `OpenCovers-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of
        "<t>.<raw body>" keyed by the secret>`. Delivery is at least once and
        in event id order. Deduplicate on `id`.
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          required: [venueId]
          properties:
            venueId:
              type: string

    VenueConfig:
      type: object
      required: [enabled, noticeAddress]
      properties:
        enabled:
          type: boolean
        noticeAddress:
          type: string
          description: Required to enable the venue and cannot be cleared while enabled.
        phoneCountry:
          type: string
          nullable: true
          example: ES
          description: |
            ISO 3166 alpha-2 country used to read a guest phone without a
            country code. Null means the country of the venue's time zone.
        turnTimes:
          type: array
          maxItems: 10
          description: |
            How long a booking holds its tables, by party size. A party uses
            the first row whose `upTo` is at least its size, or the last row
            when it is larger. `upTo` strictly increases from row to row.
            Absent when the venue has none, and then a booking holds its
            tables for 120 minutes. An empty array clears it.
          items:
            type: object
            required: [upTo, minutes]
            additionalProperties: false
            properties:
              upTo: { type: integer, minimum: 1 }
              minutes: { type: integer, minimum: 15, maximum: 480 }
          example:
            - { upTo: 2, minutes: 90 }
            - { upTo: 4, minutes: 120 }
            - { upTo: 8, minutes: 150 }

    Service:
      type: object
      required: [name, openStart, openEnd]
      properties:
        name: { type: string }
        openStart: { type: string, example: "19:00" }
        openEnd: { type: string, example: "23:00" }
        minPartySize:
          type: integer
          minimum: 1
          description: The smallest party the service takes. Absent when there is no minimum.
        maxPartySize:
          type: integer
          minimum: 1
          description: The largest party the service takes. Absent when there is no maximum.

    ErasureResult:
      type: object
      required: [erasedReservations, erasedGuests, erasedWaitlistEntries]
      properties:
        erasedReservations:
          type: integer
        erasedGuests:
          type: integer
          description: Guest records deleted.
        erasedWaitlistEntries:
          type: integer

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string

    ErrorCode:
      type: string
      enum:
        - invalid_request
        - venue_not_found
        - reservation_not_found
        - guest_not_found
        - guest_merged
        - guest_not_merged
        - unmerge_unavailable
        - unauthorized
        - forbidden
        - slot_taken
        - party_size_too_large
        - party_size_too_small
        - no_suitable_table
        - outside_hours
        - lead_time_violation
        - email_required
        - confirmation_required
        - approval_required
        - already_cancelled
        - invalid_transition
        - idempotency_in_flight
        - unknown_outcome
        - transient
        - notice_address_required
        - stale_second_factor
        - expired_cursor
        - webhook_not_found
        - webhook_url_rejected
        - webhook_limit_reached
